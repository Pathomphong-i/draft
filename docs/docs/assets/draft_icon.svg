<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#161b26"/>
      <stop offset="60%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#05080c"/>
    </radialGradient>

    <!-- Top Plane (Dimension A - Cyan) -->
    <linearGradient id="planeCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Middle Plane (Mainline - Violet) -->
    <linearGradient id="planeViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#8957e5" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Bottom Plane (Dimension B - Emerald) -->
    <linearGradient id="planeEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#238636" stop-opacity="0.15"/>
    </linearGradient>

    <!-- Intense Cosmic Glow Filter -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="2" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#388bfd" stroke-width="2" opacity="0.4"/>

  <!-- ==================== PLANE 3: BOTTOM (Emerald) ==================== -->
  <polygon points="256,260 415,335 256,415 97,335" fill="url(#planeEmerald)" stroke="#3fb950" stroke-width="3.5" opacity="0.9"/>
  <!-- Branch lines on bottom plane -->
  <line x1="165" y1="345" x2="256" y2="388" stroke="#3fb950" stroke-width="5" opacity="0.95" stroke-linecap="round"/>
  <line x1="256" y1="388" x2="345" y2="345" stroke="#3fb950" stroke-width="5" opacity="0.95" stroke-linecap="round"/>
  <!-- Nodes -->
  <circle cx="165" cy="345" r="9" fill="#0d1117" stroke="#3fb950" stroke-width="4.5" filter="url(#glow)"/>
  <circle cx="256" cy="388" r="11" fill="#3fb950" filter="url(#glow)"/>
  <circle cx="345" cy="345" r="9" fill="#0d1117" stroke="#3fb950" stroke-width="4.5" filter="url(#glow)"/>

  <!-- ==================== VERTICAL DIMENSIONAL BRIDGES (Bottom to Middle) ==================== -->
  <line x1="256" y1="388" x2="256" y2="292" stroke="#3fb950" stroke-width="3" stroke-dasharray="6,5" opacity="0.85"/>
  <line x1="165" y1="345" x2="165" y2="252" stroke="#bc8cff" stroke-width="2.5" stroke-dasharray="5,5" opacity="0.6"/>
  <line x1="345" y1="345" x2="345" y2="252" stroke="#3fb950" stroke-width="2.5" stroke-dasharray="5,5" opacity="0.6"/>

  <!-- ==================== PLANE 2: MIDDLE (Violet) ==================== -->
  <polygon points="256,168 415,245 256,322 97,245" fill="url(#planeViolet)" stroke="#bc8cff" stroke-width="3.5" opacity="0.9"/>
  <!-- Branch lines on middle plane -->
  <line x1="165" y1="252" x2="220" y2="228" stroke="#bc8cff" stroke-width="5" opacity="0.95" stroke-linecap="round"/>
  <line x1="220" y1="228" x2="295" y2="268" stroke="#bc8cff" stroke-width="5" opacity="0.95" stroke-linecap="round"/>
  <line x1="295" y1="268" x2="345" y2="252" stroke="#bc8cff" stroke-width="5" opacity="0.95" stroke-linecap="round"/>
  <line x1="220" y1="228" x2="256" y2="210" stroke="#bc8cff" stroke-width="5" opacity="0.95" stroke-linecap="round"/>
  <!-- Nodes -->
  <circle cx="165" cy="252" r="9" fill="#0d1117" stroke="#bc8cff" stroke-width="4.5" filter="url(#glow)"/>
  <circle cx="220" cy="228" r="11" fill="#bc8cff" filter="url(#glow)"/>
  <circle cx="256" cy="210" r="9" fill="#0d1117" stroke="#bc8cff" stroke-width="4.5" filter="url(#glow)"/>
  <circle cx="295" cy="268" r="9" fill="#0d1117" stroke="#bc8cff" stroke-width="4.5" filter="url(#glow)"/>
  <circle cx="345" cy="252" r="9" fill="#0d1117" stroke="#bc8cff" stroke-width="4.5" filter="url(#glow)"/>

  <!-- ==================== VERTICAL DIMENSIONAL BRIDGES (Middle to Top) ==================== -->
  <line x1="220" y1="228" x2="220" y2="138" stroke="#58a6ff" stroke-width="3.5" stroke-dasharray="6,5" opacity="0.85"/>
  <line x1="256" y1="210" x2="256" y2="120" stroke="#58a6ff" stroke-width="3" stroke-dasharray="5,5" opacity="0.7"/>
  <line x1="295" y1="268" x2="295" y2="178" stroke="#bc8cff" stroke-width="3" stroke-dasharray="5,5" opacity="0.7"/>

  <!-- ==================== PLANE 1: TOP (Cyan) ==================== -->
  <polygon points="256,76 415,152 256,228 97,152" fill="url(#planeCyan)" stroke="#58a6ff" stroke-width="3.5" opacity="0.95"/>
  <!-- Branch lines on top plane -->
  <line x1="165" y1="162" x2="220" y2="138" stroke="#58a6ff" stroke-width="5" opacity="1" stroke-linecap="round"/>
  <line x1="220" y1="138" x2="256" y2="120" stroke="#58a6ff" stroke-width="5" opacity="1" stroke-linecap="round"/>
  <line x1="220" y1="138" x2="295" y2="178" stroke="#58a6ff" stroke-width="5" opacity="1" stroke-linecap="round"/>
  <line x1="295" y1="178" x2="345" y2="162" stroke="#58a6ff" stroke-width="5" opacity="1" stroke-linecap="round"/>
  <!-- Nodes -->
  <circle cx="165" cy="162" r="9" fill="#0d1117" stroke="#58a6ff" stroke-width="4.5" filter="url(#glow)"/>
  <circle cx="220" cy="138" r="11" fill="#58a6ff" filter="url(#glow)"/>
  <circle cx="256" cy="120" r="9" fill="#0d1117" stroke="#58a6ff" stroke-width="4.5" filter="url(#glow)"/>
  <circle cx="295" cy="178" r="11" fill="#58a6ff" filter="url(#glow)"/>
  <circle cx="345" cy="162" r="9" fill="#0d1117" stroke="#58a6ff" stroke-width="4.5" filter="url(#glow)"/>
</svg>
