<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#0a0d12"/>
    </radialGradient>

    <!-- Top Plane (Dimension A - Cyan) -->
    <linearGradient id="planeCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0.10"/>
    </linearGradient>

    <!-- Middle Plane (Mainline - Violet) -->
    <linearGradient id="planeViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#bc8cff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8957e5" stop-opacity="0.10"/>
    </linearGradient>

    <!-- Bottom Plane (Dimension B - Emerald) -->
    <linearGradient id="planeEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3fb950" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#238636" stop-opacity="0.10"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- App Icon Background rounded rect -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#30363d" stroke-width="2" opacity="0.6"/>

  <!-- ==================== PLANE 3: BOTTOM (Emerald) ==================== -->
  <polygon points="256,260 410,335 256,410 102,335" fill="url(#planeEmerald)" stroke="#3fb950" stroke-width="2.5" opacity="0.85"/>
  <!-- Branch lines on bottom plane -->
  <line x1="170" y1="345" x2="256" y2="385" stroke="#3fb950" stroke-width="3.5" opacity="0.9"/>
  <line x1="256" y1="385" x2="340" y2="345" stroke="#3fb950" stroke-width="3.5" opacity="0.9"/>
  <!-- Nodes -->
  <circle cx="170" cy="345" r="7" fill="#0d1117" stroke="#3fb950" stroke-width="3.5" filter="url(#glow)"/>
  <circle cx="256" cy="385" r="8" fill="#3fb950" filter="url(#glow)"/>
  <circle cx="340" cy="345" r="7" fill="#0d1117" stroke="#3fb950" stroke-width="3.5" filter="url(#glow)"/>

  <!-- ==================== VERTICAL DIMENSIONAL BRIDGES (Bottom to Middle) ==================== -->
  <line x1="256" y1="385" x2="256" y2="295" stroke="#3fb950" stroke-width="2.5" stroke-dasharray="4,4" opacity="0.75"/>
  <line x1="170" y1="345" x2="170" y2="255" stroke="#bc8cff" stroke-width="2" stroke-dasharray="4,4" opacity="0.5"/>
  <line x1="340" y1="345" x2="340" y2="255" stroke="#3fb950" stroke-width="2" stroke-dasharray="4,4" opacity="0.5"/>

  <!-- ==================== PLANE 2: MIDDLE (Violet) ==================== -->
  <polygon points="256,170 410,245 256,320 102,245" fill="url(#planeViolet)" stroke="#bc8cff" stroke-width="2.5" opacity="0.85"/>
  <!-- Branch lines on middle plane -->
  <line x1="170" y1="255" x2="220" y2="230" stroke="#bc8cff" stroke-width="3.5" opacity="0.9"/>
  <line x1="220" y1="230" x2="295" y2="270" stroke="#bc8cff" stroke-width="3.5" opacity="0.9"/>
  <line x1="295" y1="270" x2="340" y2="255" stroke="#bc8cff" stroke-width="3.5" opacity="0.9"/>
  <line x1="220" y1="230" x2="256" y2="212" stroke="#bc8cff" stroke-width="3.5" opacity="0.9"/>
  <!-- Nodes -->
  <circle cx="170" cy="255" r="7" fill="#0d1117" stroke="#bc8cff" stroke-width="3.5" filter="url(#glow)"/>
  <circle cx="220" cy="230" r="8" fill="#bc8cff" filter="url(#glow)"/>
  <circle cx="256" cy="212" r="7" fill="#0d1117" stroke="#bc8cff" stroke-width="3.5" filter="url(#glow)"/>
  <circle cx="295" cy="270" r="7" fill="#0d1117" stroke="#bc8cff" stroke-width="3.5" filter="url(#glow)"/>
  <circle cx="340" cy="255" r="7" fill="#0d1117" stroke="#bc8cff" stroke-width="3.5" filter="url(#glow)"/>

  <!-- ==================== VERTICAL DIMENSIONAL BRIDGES (Middle to Top) ==================== -->
  <line x1="220" y1="230" x2="220" y2="140" stroke="#58a6ff" stroke-width="2.5" stroke-dasharray="4,4" opacity="0.75"/>
  <line x1="256" y1="212" x2="256" y2="122" stroke="#58a6ff" stroke-width="2" stroke-dasharray="4,4" opacity="0.5"/>
  <line x1="295" y1="270" x2="295" y2="180" stroke="#bc8cff" stroke-width="2" stroke-dasharray="4,4" opacity="0.5"/>

  <!-- ==================== PLANE 1: TOP (Cyan) ==================== -->
  <polygon points="256,80 410,155 256,230 102,155" fill="url(#planeCyan)" stroke="#58a6ff" stroke-width="2.5" opacity="0.9"/>
  <!-- Branch lines on top plane -->
  <line x1="170" y1="165" x2="220" y2="140" stroke="#58a6ff" stroke-width="3.5" opacity="0.95"/>
  <line x1="220" y1="140" x2="256" y2="122" stroke="#58a6ff" stroke-width="3.5" opacity="0.95"/>
  <line x1="220" y1="140" x2="295" y2="180" stroke="#58a6ff" stroke-width="3.5" opacity="0.95"/>
  <line x1="295" y1="180" x2="340" y2="165" stroke="#58a6ff" stroke-width="3.5" opacity="0.95"/>
  <!-- Nodes -->
  <circle cx="170" cy="165" r="7" fill="#0d1117" stroke="#58a6ff" stroke-width="3.5" filter="url(#glow)"/>
  <circle cx="220" cy="140" r="8" fill="#58a6ff" filter="url(#glow)"/>
  <circle cx="256" cy="122" r="7" fill="#0d1117" stroke="#58a6ff" stroke-width="3.5" filter="url(#glow)"/>
  <circle cx="295" cy="180" r="8" fill="#58a6ff" filter="url(#glow)"/>
  <circle cx="340" cy="165" r="7" fill="#0d1117" stroke="#58a6ff" stroke-width="3.5" filter="url(#glow)"/>
</svg>
