<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DraftMultiverse — Parallel Dimension Code Platform</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
  <style>
    :root {
      --bg-canvas: #070a10;
      --bg-surface: #0d121b;
      --bg-elevated: #141b27;
      --bg-hover: #1b2434;
      --border: #232f42;
      --border-subtle: #192231;
      --text-main: #e6edf6;
      --text-muted: #8b9bb4;
      --text-dim: #5d6d85;
      --cyan: #38bdf8;
      --cyan-dim: rgba(56, 189, 248, 0.14);
      --violet: #a855f7;
      --violet-dim: rgba(168, 85, 247, 0.16);
      --emerald: #22c55e;
      --emerald-dim: rgba(34, 197, 94, 0.15);
      --amber: #f59e0b;
      --amber-dim: rgba(245, 158, 11, 0.16);
      --rose: #f43f5e;
      --rose-dim: rgba(244, 63, 94, 0.16);
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: radial-gradient(circle at 15% -10%, rgba(56, 189, 248, 0.08), transparent 42%),
                  radial-gradient(circle at 85% 0%, rgba(168, 85, 247, 0.08), transparent 40%),
                  var(--bg-canvas);
      color: var(--text-main);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.5;
      min-height: 100vh;
    }

    a { color: var(--cyan); text-decoration: none; }
    a:hover { text-decoration: underline; }

    code, pre, .mono { font-family: var(--mono); }

    /* Top Navigation */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 60;
      background: rgba(10, 14, 22, 0.88);
      backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--border);
      padding: 0 20px;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
    }
    .topbar-left, .topbar-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      color: var(--text-main);
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.02em;
      cursor: pointer;
      text-decoration: none !important;
    }
    .brand img {
      width: 28px;
      height: 28px;
      border-radius: 7px;
    }
    .brand-tag {
      font-size: 11px;
      font-family: var(--mono);
      padding: 2px 7px;
      border-radius: 999px;
      background: linear-gradient(135deg, var(--cyan-dim), var(--violet-dim));
      border: 1px solid rgba(168, 85, 247, 0.35);
      color: #d8b4fe;
      font-weight: 600;
    }
    .nav-link {
      color: var(--text-muted);
      font-weight: 500;
      font-size: 13.5px;
      padding: 6px 10px;
      border-radius: 7px;
      cursor: pointer;
      transition: all 0.15s;
      text-decoration: none !important;
      white-space: nowrap;
    }
    .nav-link:hover, .nav-link.active {
      color: var(--text-main);
      background: var(--bg-elevated);
    }
    .search-input {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 8px;
      padding: 6px 11px;
      font-size: 13px;
      width: 220px;
      outline: none;
    }
    .search-input:focus { border-color: var(--cyan); }

    /* Layout */
    .container {
      max-width: 1280px;
      margin: 0 auto;
      padding: 22px 20px 64px;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1.75fr 1fr;
      gap: 20px;
    }
    .grid-equal {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    @media (max-width: 960px) {
      .grid-2, .grid-equal, .grid-3 { grid-template-columns: 1fr; }
      .search-input { display: none; }
    }

    /* Cards & Panels */
    .card {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 11px;
      overflow: hidden;
      margin-bottom: 16px;
    }
    .card-header {
      padding: 12px 16px;
      background: rgba(20, 27, 39, 0.65);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      font-weight: 600;
    }
    .card-body { padding: 16px; }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 600;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.14s;
      text-decoration: none !important;
      white-space: nowrap;
    }
    .btn:hover { background: var(--bg-hover); border-color: #364863; }
    .btn-sm { padding: 4px 9px; font-size: 12px; border-radius: 6px; }
    .btn-primary {
      background: linear-gradient(135deg, #0284c7, #2563eb);
      border-color: #38bdf8;
      color: #fff;
    }
    .btn-primary:hover { filter: brightness(1.1); }
    .btn-quantum {
      background: linear-gradient(135deg, #7e22ce, #4f46e5);
      border-color: #a855f7;
      color: #fff;
    }
    .btn-quantum:hover { filter: brightness(1.12); }
    .btn-emerald {
      background: rgba(22, 163, 74, 0.9);
      border-color: #22c55e;
      color: #fff;
    }
    .btn-danger {
      background: var(--rose-dim);
      border-color: rgba(244, 63, 94, 0.45);
      color: #fda4af;
    }
    .btn-danger:hover { background: rgba(244, 63, 94, 0.28); }

    /* Badges / Pills */
    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 600;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text-muted);
      white-space: nowrap;
    }
    .pill-dim {
      background: var(--violet-dim);
      border-color: rgba(168, 85, 247, 0.42);
      color: #d8b4fe;
    }
    .pill-main {
      background: var(--cyan-dim);
      border-color: rgba(56, 189, 248, 0.42);
      color: #7dd3fc;
    }
    .pill-clean {
      background: var(--emerald-dim);
      border-color: rgba(34, 197, 94, 0.42);
      color: #86efac;
    }
    .pill-hot {
      background: var(--amber-dim);
      border-color: rgba(245, 158, 11, 0.45);
      color: #fcd34d;
    }
    .pill-conflict {
      background: var(--rose-dim);
      border-color: rgba(244, 63, 94, 0.45);
      color: #fda4af;
    }

    /* Inputs & Forms */
    input[type="text"], input[type="password"], input[type="email"], select, textarea {
      width: 100%;
      background: var(--bg-canvas);
      border: 1px solid var(--border);
      color: var(--text-main);
      border-radius: 8px;
      padding: 8px 11px;
      font-size: 13.5px;
      font-family: inherit;
      outline: none;
    }
    textarea.code-editor {
      font-family: var(--mono);
      font-size: 12.5px;
      line-height: 1.55;
      min-height: 320px;
      tab-size: 2;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--cyan); }
    .form-group { margin-bottom: 13px; }
    .form-label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 5px;
    }

    /* Repo Header & Tabs */
    .repo-banner {
      background: linear-gradient(180deg, rgba(20, 27, 39, 0.72), rgba(13, 18, 27, 0.95));
      border-bottom: 1px solid var(--border);
      padding: 18px 20px 0;
      margin: -22px -20px 20px;
    }
    .repo-banner-inner {
      max-width: 1280px;
      margin: 0 auto;
    }
    .repo-title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .repo-tabs {
      display: flex;
      gap: 4px;
      overflow-x: auto;
      padding-bottom: 1px;
    }
    .repo-tab {
      padding: 9px 13px;
      font-size: 13px;
      font-weight: 600;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      white-space: nowrap;
      transition: all 0.14s;
    }
    .repo-tab:hover { color: var(--text-main); background: rgba(255,255,255,0.03); border-radius: 7px 7px 0 0; }
    .repo-tab.active {
      color: var(--text-main);
      border-bottom-color: var(--violet);
    }

    /* Tables & File Tree */
    .tree-table {
      width: 100%;
      border-collapse: collapse;
    }
    .tree-table th, .tree-table td {
      padding: 9px 14px;
      border-bottom: 1px solid var(--border-subtle);
      text-align: left;
      font-size: 13.5px;
    }
    .tree-table tr:last-child td { border-bottom: none; }
    .tree-table tr:hover td { background: rgba(255, 255, 255, 0.025); }

    /* Code & Diff Viewer */
    .code-table {
      width: 100%;
      border-collapse: collapse;
      font-family: var(--mono);
      font-size: 12.5px;
      line-height: 1.5;
    }
    .code-ln {
      width: 48px;
      text-align: right;
      padding: 0 12px;
      color: var(--text-dim);
      user-select: none;
      border-right: 1px solid var(--border-subtle);
    }
    .code-line {
      padding: 0 14px;
      white-space: pre;
      overflow-x: auto;
    }
    .diff-box {
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.5;
      overflow-x: auto;
      background: #06090f;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .diff-line { padding: 1px 12px; white-space: pre; }
    .diff-add { background: rgba(34, 197, 94, 0.14); color: #86efac; }
    .diff-del { background: rgba(244, 63, 94, 0.14); color: #fda4af; }
    .diff-hunk { background: rgba(56, 189, 248, 0.12); color: #7dd3fc; font-weight: 600; }
    .diff-hdr { color: var(--text-muted); font-weight: 600; background: rgba(255,255,255,0.03); }

    /* Entropy Meter */
    .entropy-bar {
      width: 96px;
      height: 7px;
      background: var(--bg-canvas);
      border: 1px solid var(--border);
      border-radius: 999px;
      overflow: hidden;
      display: inline-block;
      vertical-align: middle;
    }
    .entropy-fill {
      height: 100%;
      border-radius: 999px;
    }

    /* Hero & Quickstart */
    .hero {
      background: linear-gradient(135deg, rgba(14, 24, 42, 0.95), rgba(25, 14, 43, 0.92));
      border: 1px solid rgba(168, 85, 247, 0.35);
      border-radius: 14px;
      padding: 22px 24px;
      margin-bottom: 20px;
      position: relative;
      overflow: hidden;
    }
    .pre-cmd {
      background: #05070c;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 11px 13px;
      font-family: var(--mono);
      font-size: 12px;
      color: #cbd5e1;
      overflow-x: auto;
      margin: 0;
    }

    /* Dropdown & Modal */
    .dropdown { position: relative; }
    .dropdown-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 9px;
      min-width: 210px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.55);
      padding: 6px;
      z-index: 90;
      display: none;
    }
    .dropdown.open .dropdown-menu { display: block; }
    .dropdown-item {
      padding: 7px 11px;
      border-radius: 6px;
      font-size: 13px;
      color: var(--text-main);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .dropdown-item:hover { background: var(--bg-hover); }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 6, 12, 0.78);
      backdrop-filter: blur(5px);
      z-index: 120;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      width: 100%;
      max-width: 820px;
      max-height: 88vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 60px rgba(0,0,0,0.7);
    }
    .modal-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 700;
      font-size: 15px;
    }
    .modal-body {
      padding: 18px;
      overflow-y: auto;
    }

    /* Toast */
    .toast-wrap {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .toast {
      background: var(--bg-elevated);
      border: 1px solid var(--cyan);
      color: var(--text-main);
      padding: 10px 15px;
      border-radius: 9px;
      font-size: 13px;
      box-shadow: 0 10px 28px rgba(0,0,0,0.5);
      max-width: 380px;
    }
    .toast.err { border-color: var(--rose); color: #fecdd3; }

    /* Markdown Prose */
    .markdown-body { font-size: 14px; line-height: 1.65; color: var(--text-main); }
    .markdown-body h1, .markdown-body h2, .markdown-body h3 {
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 6px;
      margin-top: 20px;
    }
    .markdown-body pre {
      background: #06090f;
      border: 1px solid var(--border);
      padding: 12px;
      border-radius: 8px;
      overflow-x: auto;
    }
    .markdown-body code {
      background: rgba(255,255,255,0.07);
      padding: 2px 5px;
      border-radius: 4px;
      font-size: 12.5px;
    }
    .markdown-body pre code { background: transparent; padding: 0; }
    .muted { color: var(--text-muted); }
    .flex-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .spacer { flex: 1; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a class="brand" onclick="nav('/'); return false;" href="/">
        <img src="/assets/logo.svg" alt="Draft" />
        <span>DraftMultiverse</span>
        <span class="brand-tag">Kairos L2 · v__VERSION__</span>
      </a>
      <a class="nav-link" onclick="nav('/explore'); return false;" href="/explore">🌌 Multiverses</a>
      <a class="nav-link" onclick="nav('/pulls'); return false;" href="/pulls">🌊 Convergence</a>
      <a class="nav-link" onclick="nav('/issues'); return false;" href="/issues">⊙ Swarm Tasks</a>
      <button class="btn btn-sm btn-quantum" onclick="openSkillModal()">🤖 SKILL.md</button>
    </div>
    <div class="topbar-right">
      <input id="globalSearch" class="search-input" type="text" placeholder="Search multiverses, dimensions..." onkeydown="if(event.key==='Enter'){nav('/explore?q='+encodeURIComponent(this.value));}" />
      <div class="dropdown" id="plusDropdown">
        <button class="btn btn-sm" onclick="toggleDropdown('plusDropdown')">＋ Spawn ▾</button>
        <div class="dropdown-menu">
          <div class="dropdown-item" onclick="closeDropdowns(); nav('/repo/create')">🌌 New Multiverse Repo</div>
          <div class="dropdown-item" onclick="closeDropdowns(); nav('/repo/migrate')">⇄ Assimilate Git Repo</div>
          <div class="dropdown-item" onclick="closeDropdowns(); nav('/org/create')">🛸 New Swarm Org</div>
        </div>
      </div>
      <div id="authArea"></div>
    </div>
  </header>

  <main class="container" id="appRoot">
    <div class="card"><div class="card-body muted">Initializing Multiverse Spacetime Engine...</div></div>
  </main>

  <div class="modal-backdrop" id="modalBackdrop" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <div class="modal-header">
        <span id="modalTitle">Inspector</span>
        <button class="btn btn-sm" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="toast-wrap" id="toastWrap"></div>

  <script>
    const SERVER_URL = "__SERVER_URL__";
    const APP = {
      me: null,
      orgs: [],
      tokens: [],
      repoOverview: null,
      repoRadar: null,
    };

    document.addEventListener("click", (e) => {
      if (!e.target.closest(".dropdown")) closeDropdowns();
    });

    function toggleDropdown(id) {
      const el = document.getElementById(id);
      if (!el) return;
      const was = el.classList.contains("open");
      closeDropdowns();
      if (!was) el.classList.add("open");
    }
    function closeDropdowns() {
      document.querySelectorAll(".dropdown.open").forEach(d => d.classList.remove("open"));
    }

    function openModal(title, html) {
      document.getElementById("modalTitle").innerHTML = title;
      document.getElementById("modalBody").innerHTML = html;
      document.getElementById("modalBackdrop").classList.add("open");
    }
    function closeModal() {
      document.getElementById("modalBackdrop").classList.remove("open");
    }

    function toast(msg, isErr = false) {
      const wrap = document.getElementById("toastWrap");
      const el = document.createElement("div");
      el.className = "toast" + (isErr ? " err" : "");
      el.textContent = msg;
      wrap.appendChild(el);
      setTimeout(() => el.remove(), 4200);
    }

    function copyText(txt, label = "Copied to clipboard") {
      if (navigator.clipboard) {
        navigator.clipboard.writeText(txt).then(() => toast(label));
      } else {
        const ta = document.createElement("textarea");
        ta.value = txt;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand("copy");
        ta.remove();
        toast(label);
      }
    }

    function esc(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function fmtBytes(bytes) {
      const n = Number(bytes || 0);
      if (n < 1024) return n + " B";
      if (n < 1024 * 1024) return (n / 1024).toFixed(1) + " KB";
      return (n / (1024 * 1024)).toFixed(2) + " MB";
    }

    function timeAgo(iso) {
      if (!iso) return "just now";
      const sec = Math.max(1, Math.floor((Date.now() - new Date(iso).getTime()) / 1000));
      if (sec < 60) return sec + "s ago";
      if (sec < 3600) return Math.floor(sec / 60) + "m ago";
      if (sec < 86400) return Math.floor(sec / 3600) + "h ago";
      return Math.floor(sec / 86400) + "d ago";
    }

    function fmtTs(ts) {
      if (!ts) return "";
      const d = typeof ts === "number" ? new Date(ts * 1000) : new Date(ts);
      return isNaN(d.getTime()) ? String(ts) : timeAgo(d.toISOString());
    }

    function renderMarkdown(md) {
      if (!md) return "";
      let html = esc(md);
      html = html.replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, (_, _lang, code) => `<pre><code>${code}</code></pre>`);
      html = html.replace(/^### (.*)$/gm, "<h3>$1</h3>");
      html = html.replace(/^## (.*)$/gm, "<h2>$1</h2>");
      html = html.replace(/^# (.*)$/gm, "<h1>$1</h1>");
      html = html.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      html = html.replace(/`([^`\n]+)`/g, "<code>$1</code>");
      html = html.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|\/[^\s)]+)\)/g, `<a href="$2" target="_blank" rel="noopener">$1</a>`);
      html = html.replace(/\n\n+/g, "</p><p>");
      return `<div class="markdown-body"><p>${html}</p></div>`;
    }

    function renderDiffHtml(diffText) {
      if (!diffText || !diffText.trim()) {
        return `<div class="muted" style="padding:12px;">No tree differences between these spacetime states.</div>`;
      }
      const lines = diffText.split("\n").map(line => {
        let cls = "diff-line";
        if (line.startsWith("+++") || line.startsWith("---") || line.startsWith("diff ")) cls += " diff-hdr";
        else if (line.startsWith("@@")) cls += " diff-hunk";
        else if (line.startsWith("+")) cls += " diff-add";
        else if (line.startsWith("-")) cls += " diff-del";
        return `<div class="${cls}">${esc(line) || " "}</div>`;
      }).join("");
      return `<div class="diff-box">${lines}</div>`;
    }

    function entropyBadge(foresee) {
      if (!foresee || !foresee.valid) return `<span class="pill">N/A</span>`;
      const h = Number(foresee.entropy || 0);
      const pct = Math.min(100, Math.round(h * 100));
      const color = foresee.has_conflicts ? "#f43f5e" : (h > 0.35 ? "#f59e0b" : "#22c55e");
      const statusPill = foresee.has_conflicts
        ? `<span class="pill pill-conflict">⚡ Conflict (${(foresee.conflicting_files || []).length})</span>`
        : `<span class="pill pill-clean">✓ Clean 3-Way</span>`;
      return `
        <span class="flex-row" style="display:inline-flex; gap:6px;">
          ${statusPill}
          <span class="pill mono" title="Divergence Entropy H(D_A, D_B) in [0, 1]">
            H=${h.toFixed(2)} · ${esc(foresee.risk_tier || "Low")}

    async function api(path, opts = {}) {
      const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
      const res = await fetch(path, Object.assign({}, opts, { headers }));
      const ctype = res.headers.get("content-type") || "";
      const data = ctype.includes("application/json") ? await res.json() : await res.text();
      if (!res.ok) {
        const msg = (data && data.error) ? data.error : (typeof data === "string" ? data : `HTTP ${res.status}`);
        throw new Error(msg);
      }
      return data;
    }

    async function route() {
      const path = window.location.pathname.replace(/\/+$/, "") || "/";
      const params = new URLSearchParams(window.location.search);
      const segs = path.split("/").filter(Boolean);

      if (path === "/") return renderHome();
      if (path === "/explore") return renderExplore(params);
      if (path === "/pulls") return renderGlobalPulls(params);
      if (path === "/issues") return renderGlobalIssues(params);
      if (path === "/login") return renderLogin();
      if (path === "/register") return renderRegister();
      if (path === "/user/settings") return renderUserSettings();
      if (path === "/admin") return renderAdmin();
      if (path === "/repo/create") return renderCreateRepo();
      if (path === "/repo/migrate") return renderMigrateRepo();
      if (path === "/org/create") return renderCreateOrg();

      if (segs.length === 1) return renderOwnerProfile(decodeURIComponent(segs[0]));
      if (segs.length >= 2) {
        const owner = decodeURIComponent(segs[0]);
        const repo = decodeURIComponent(segs[1]).replace(/\.dft$/, "");
        return renderRepoWorkspace(owner, repo, params);
      }
    }

    function buildDimensionOptions(ov, radar, selectedRef) {
      const def = ov.meta.default_branch;
      const dims = ov.dimensions || [];
      const branches = (ov.branches || []).filter(b => b.name !== def);
      const snaps = (radar && radar.snapshots) || [];
      const tags = ov.tags || [];

      let html = `<optgroup label="⚡ Mainline Spacetime">`;
      html += `<option value="${esc(def)}" ${(selectedRef===def || selectedRef==='mainline')?'selected':''}>⚡ mainline (${esc(def)})</option>`;
      html += `</optgroup>`;

      if (dims.length > 0) {
        html += `<optgroup label="🌌 Parallel Dimensions (${dims.length})">`;
        dims.forEach(d => {
          html += `<option value="${esc(d.name)}" ${selectedRef===d.name?'selected':''}>🌌 ${esc(d.name)} (${esc(d.short_commit)})</option>`;
        });
        html += `</optgroup>`;
      }
      if (snaps.length > 0) {
        html += `<optgroup label="📸 Immutable Snapshots (${snaps.length})">`;
        snaps.forEach(s => {
          const full = `refs/snapshots/${s.name}`;
          html += `<option value="${esc(full)}" ${selectedRef===full?'selected':''}>📸 ${esc(s.name)} (${esc(s.short_commit)})</option>`;
        });
        html += `</optgroup>`;
      }
      if (branches.length > 0 || tags.length > 0) {
        html += `<optgroup label="🌿 Additional Heads & Tags">`;
        branches.forEach(b => {
          html += `<option value="${esc(b.name)}" ${selectedRef===b.name?'selected':''}>🌿 ${esc(b.name)}</option>`;
        });
        tags.forEach(t => {
          html += `<option value="${esc(t.name)}" ${selectedRef===t.name?'selected':''}>🏷️ ${esc(t.name)}</option>`;
        });
        html += `</optgroup>`;
      }
      return html;
    }

      const claims = (radar.territory && radar.territory.claims) || {};
      const fences = (radar.territory && radar.territory.fences) || [];
      const hotZones = radar.hot_zones || [];

      const fileBadges = (entryPath, isDir) => {
        const badges = [];
        const hz = hotZones.find(h => isDir ? h.path.startsWith(entryPath + "/") : h.path === entryPath);
        if (hz) {
          badges.push(`<span class="pill pill-hot" style="cursor:pointer;" title="Modified concurrently in: ${(hz.dimensions||[]).join(', ')}" onclick="event.stopPropagation(); promptObserveModal('${esc(owner)}','${esc(repo)}','${esc(hz.path)}')">🔥 Hot (${hz.touch_count} dims)</span>`);
        }
        Object.values(claims).forEach(c => {
          const cp = (c.path || "").replace(/\/+$/, "");
          if (cp && (entryPath === cp || entryPath.startsWith(cp + "/") || (isDir && cp.startsWith(entryPath + "/")))) {
            badges.push(`<span class="pill pill-dim" title="Claimed territory">🔒 ${esc(c.dimension)} · ${esc(c.agent || 'agent')}</span>`);

        fences.forEach(f => {
          const fp = (f.path || "").replace(/\*+$/, "").replace(/\/+$/, "");

            badges.push(`<span class="pill pill-conflict" title="Hard Boundary Fence: ${esc(f.reason || '')}">🚧 Fenced (${esc(f.dimension)})</span>`);
          }
        });
        return badges.slice(0, 3).join(" ");

      const lc = tree.latest_commit;
      const parentDir = dirPath.includes("/") ? dirPath.split("/").slice(0, -1).join("/") : "";

                </tr>
              ` : ""}
              ${(tree.entries || []).map(e => {
                const targetUrl = e.is_dir
                  ? `/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}?tab=code&ref=${encodeURIComponent(ref)}&path=${encodeURIComponent(e.path)}`
                  : `/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}?tab=code&ref=${encodeURIComponent(ref)}&blob=${encodeURIComponent(e.path)}`;

                  <tr style="cursor:pointer;" onclick="nav('${targetUrl}')">
                    <td>
                      ${e.is_dir ? "📁" : "📄"}
                      <a href="${targetUrl}" onclick="event.stopPropagation(); nav('${targetUrl}'); return false;" style="font-weight:${e.is_dir?'600':'400'}; margin-left:6px;">
                        ${esc(e.name)}
                      </a>
                      <span style="margin-left:8px;">${fileBadges(e.path, e.is_dir)}</span>
                    </td>
                    <td class="mono muted" style="font-size:12px; width:120px;">${esc((e.oid || "").slice(0, 8))}</td>
                    <td class="muted" style="text-align:right; width:100px;">${e.is_dir ? "tree" : fmtBytes(e.size)}</td>
                    <td style="text-align:right; width:90px;">
                      ${!e.is_dir ? `<button class="btn btn-sm" onclick="event.stopPropagation(); promptObserveModal('${esc(owner)}','${esc(repo)}','${esc(e.path)}')" title="Observe across dimensions">👁️</button>` : ""}

              </div>
              <div class="flex-row" style="margin-bottom:14px;">
                <input id="msgBody" type="text" placeholder="Coordination message to peer dimensions..." style="flex:1;" />
                <button class="btn btn-quantum" onclick="sendSwarmMsg('${esc(owner)}','${esc(repo)}')">Broadcast</button>
              </div>
              ${msgs.length === 0 ? `<div class="muted">Swarm inbox is clear.</div>` : msgs.map(m => `
                <div style="padding:9px 0; border-bottom:1px solid var(--border-subtle);">
                  <div class="flex-row">
                    <span class="pill pill-main">@${esc(m.sender)}</span>
                    <span class="muted">→</span>
                    <span class="pill ${m.recipient==='*'?'pill-dim':''}">${m.recipient === '*' ? '📡 All Swarm (*)' : esc(m.recipient)}</span>
                    <strong>${esc(m.subject)}</strong>
                    <span class="spacer"></span>
                    <span class="muted" style="font-size:11.5px;">${timeAgo(m.created_at)}</span>
                  </div>
                  <div style="margin-top:4px; font-size:13px;">${esc(m.body)}</div>
                </div>
              `).join("")}
            </div>
          </div>
        </div>
      `;
    }

    async function registerAgent(owner, repo) {
      try {
        const caps = document.getElementById("agCaps").value.split(",").map(s => s.trim()).filter(Boolean);
        await api(`/api/v1/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/agents`, {
          method: "POST",
          body: JSON.stringify({
            name: document.getElementById("agName").value,
            assigned_dimension: document.getElementById("agDim").value,
            agent_type: document.getElementById("agType").value,
            capabilities: caps,
          }),
        });
        toast("Swarm agent registered");
        route();
      } catch (e) { toast(e.message, true); }
    }

    async function pingAgent(owner, repo, name) {
      await api(`/api/v1/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/agents/heartbeat`, {
        method: "POST",
        body: JSON.stringify({ name, status: "active" }),
      });
      toast(`Heartbeat recorded for ${name}`);
      route();
    }

    async function sendSwarmMsg(owner, repo) {
      try {
        await api(`/api/v1/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/messages`, {
          method: "POST",
          body: JSON.stringify({
            recipient: document.getElementById("msgTo").value,
            subject: document.getElementById("msgSubj").value,
            body: document.getElementById("msgBody").value,
          }),
        });
        toast("Swarm message dispatched");
        route();
      } catch (e) { toast(e.message, true); }
    }

    // -------------------------------------------------------------------------
    // Tab 7: Swarm Tasks & Issues
    // -------------------------------------------------------------------------
    async function renderIssuesTab(owner, repo, ov, params) {
      const box = document.getElementById("repoTabBody");
      const issNum = params.get("issue");
      const st = params.get("state") || "open";

      if (issNum) {
        const iss = await api(`/api/v1/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/issues/${encodeURIComponent(issNum)}`);
        box.innerHTML = `
          <div class="card">
            <div class="card-header">
              <div class="flex-row">
                <span class="pill ${iss.state==='open'?'pill-clean':'pill-dim'}">${esc(iss.state)}</span>
                <strong>#${iss.number} ${esc(iss.title)}</strong>
                ${iss.assignee ? `<span class="pill pill-dim">🤖 ${esc(iss.assignee)}</span>` : ""}
              </div>
              <div class="flex-row">
                <button class="btn btn-sm" onclick="toggleIssueState('${esc(owner)}','${esc(repo)}',${iss.number},'${iss.state==='open'?'closed':'open'}')">${iss.state==='open'?'Close Task':'Reopen Task'}</button>
                <button class="btn btn-sm" onclick="nav('/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}?tab=issues')">← Back</button>
              </div>
            </div>
            <div class="card-body">
              ${iss.body ? renderMarkdown(iss.body) : `<div class="muted">No task details.</div>`}
              <hr style="border:none;border-top:1px solid var(--border-subtle);margin:14px 0;" />
              ${(iss.comments || []).map(c => `<div style="padding:7px 0;border-bottom:1px solid var(--border-subtle);"><strong>@${esc(c.author)}</strong> <span class="muted">${timeAgo(c.created_at)}</span><div>${esc(c.body)}</div></div>`).join("")}
              <div class="flex-row" style="margin-top:10px;">
                <input id="issCmt" type="text" placeholder="Add task update..." style="flex:1;" />
                <button class="btn btn-primary" onclick="commentIssue('${esc(owner)}','${esc(repo)}',${iss.number})">Comment</button>
              </div>
            </div>
          </div>
        `;
        return;
      }

      const d = await api(`/api/v1/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/issues?state=${encodeURIComponent(st)}`);
      box.innerHTML = `
        <div class="grid-2">
          <div class="card">
            <div class="card-header">
              <div class="flex-row">
                <span>⊙ Swarm Tasks</span>
                <button class="btn btn-sm ${st==='open'?'btn-primary':''}" onclick="nav('/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}?tab=issues&state=open')">Open (${d.open_count||0})</button>
                <button class="btn btn-sm ${st==='closed'?'btn-primary':''}" onclick="nav('/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}?tab=issues&state=closed')">Closed (${d.closed_count||0})</button>
              </div>
            </div>
            <div class="card-body" style="padding:0;">
              ${(d.issues || []).length === 0 ? `<div class="muted" style="padding:20px;">No tasks in this state.</div>` : (d.issues || []).map(i => `
                <div style="padding:12px 16px; border-bottom:1px solid var(--border-subtle);" class="flex-row">
                  <span class="pill ${i.state==='open'?'pill-clean':'pill-dim'}">#${i.number}</span>
                  <a href="/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}?tab=issues&issue=${i.number}" onclick="nav('/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}?tab=issues&issue=${i.number}'); return false;"><strong>${esc(i.title)}</strong></a>
                  ${(i.labels || []).map(l => `<span class="pill">${esc(l)}</span>`).join("")}
                  ${i.assignee ? `<span class="pill pill-dim">🤖 ${esc(i.assignee)}</span>` : ""}
                  <span class="spacer"></span>
                  <span class="muted">@${esc(i.author)} · ${timeAgo(i.updated_at)}</span>
                </div>
              `).join("")}
            </div>
          </div>

          <div class="card">
            <div class="card-header">＋ Dispatch New Swarm Task</div>
            <div class="card-body">
              <div class="form-group"><label class="form-label">Task Title</label><input id="niTitle" type="text" placeholder="Implement zero-copy pack delta" /></div>
              <div class="form-group"><label class="form-label">Assigned Agent / Dimension</label><input id="niAssign" type="text" placeholder="agent-storage" /></div>
              <div class="form-group"><label class="form-label">Labels (comma separated)</label><input id="niLabels" type="text" placeholder="swarm, layer-2" /></div>
              <div class="form-group"><label class="form-label">Specification</label><textarea id="niBody" rows="4"></textarea></div>
              <button class="btn btn-primary" onclick="createIssue('${esc(owner)}','${esc(repo)}')">Create Swarm Task</button>
            </div>
          </div>
        </div>
      `;
    }

    async function createIssue(owner, repo) {
      try {
        const labels = document.getElementById("niLabels").value.split(",").map(s => s.trim()).filter(Boolean);
        const iss = await api(`/api/v1/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/issues`, {
          method: "POST",
          body: JSON.stringify({
            title: document.getElementById("niTitle").value,
            assignee: document.getElementById("niAssign").value,
            labels,
            body: document.getElementById("niBody").value,
          }),
        });
        nav(`/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}?tab=issues&issue=${iss.number}`);
      } catch (e) { toast(e.message, true); }
    }

    async function toggleIssueState(owner, repo, num, state) {
      await api(`/api/v1/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/issues/${num}`, { method: "PATCH", body: JSON.stringify({ state }) });
      route();
    }

    async function commentIssue(owner, repo, num) {
      const body = document.getElementById("issCmt").value.trim();
      if (!body) return;
      await api(`/api/v1/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/issues/${num}/comments`, { method: "POST", body: JSON.stringify({ body }) });
      route();
    }

    // -------------------------------------------------------------------------
    // Tab 8: Commit History Inspector & Multiverse Settings
    // -------------------------------------------------------------------------
    async function renderCommitsTab(owner, repo, ov, params) {
      const box = document.getElementById("repoTabBody");
      const ref = params.get("ref") || ov.selected_ref || ov.meta.default_branch;
      const d = await api(`/api/v1/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/commits?ref=${encodeURIComponent(ref)}&limit=60`);
      const commits = d.commits || [];

      box.innerHTML = `
        <div class="flex-row" style="margin-bottom:14px;">
          <select style="width:260px;" onchange="nav('/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}?tab=commits&ref='+encodeURIComponent(this.value))">
            ${buildDimensionOptions(ov, APP.repoRadar, ref)}
          </select>
          <span class="spacer"></span>
          <button class="btn btn-sm" onclick="nav('/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}?tab=settings')">⚙️ Multiverse Settings</button>
        </div>
        <div class="card">
          <div class="card-header">⏱️ CAS Spacetime Commit Log — <code>${esc(ref)}</code> (${commits.length})</div>
          <div class="card-body" style="padding:0;">
            ${commits.map(c => `
              <div style="padding:11px 16px; border-bottom:1px solid var(--border-subtle);" class="flex-row">
                <div>
                  <div style="font-weight:600;">${esc(c.summary)}</div>
                  <div class="muted" style="font-size:12px;">${esc(c.author_name)} · ${fmtTs(c.timestamp)} ${(c.parents||[]).length > 1 ? `<span class="pill pill-dim">Converge (${c.parents.length} parents)</span>` : ""}</div>
                </div>
                <span class="spacer"></span>
                <button class="btn btn-sm mono" onclick="inspectCommitModal('${esc(owner)}','${esc(repo)}','${esc(c.id)}')">${esc(c.short_id)}</button>
              </div>
            `).join("")}
          </div>
        </div>
      `;
    }

    async function inspectCommitModal(owner, repo, sha) {
      try {
        const d = await api(`/api/v1/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/commits/${encodeURIComponent(sha)}`);
        const c = d.commit || {};
        openModal(
          `CAS Commit <code>${esc(c.short_id || sha.slice(0, 8))}</code>`,
          `
            <div style="margin-bottom:12px;">
              <div style="font-weight:700; font-size:15px;">${esc(c.message || c.summary)}</div>
              <div class="muted" style="font-size:12.5px; margin-top:4px;">
                Author: ${esc(c.author_name)} &lt;${esc(c.author_email)}&gt; · Tree: <code>${esc((c.tree || "").slice(0, 12))}</code> ·
                ${d.stats?.files_changed || 0} files (+${d.stats?.additions || 0} / -${d.stats?.deletions || 0})
              </div>
            </div>
            ${renderDiffHtml(d.diff)}
          `
        );
      } catch (e) { toast(e.message, true); }
    }

    function renderSettingsTab(owner, repo, ov) {
      const m = ov.meta;
      document.getElementById("repoTabBody").innerHTML = `
        <div class="card" style="max-width:680px;">
          <div class="card-header">
            <span>⚙️ Multiverse Settings — ${esc(m.owner)}/${esc(m.name)}</span>
            <button class="btn btn-sm" onclick="nav('/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}?tab=commits')">← Commit History</button>
          </div>
          <div class="card-body">
            <div class="form-group"><label class="form-label">Description</label><input id="stDesc" type="text" value="${esc(m.description)}" /></div>
            <div class="form-group"><label class="form-label">Mainline Default Reference</label><input id="stDef" type="text" value="${esc(m.default_branch)}" /></div>
            <div class="form-group"><label class="form-label">Topics (comma separated)</label><input id="stTopics" type="text" value="${esc((m.topics || []).join(', '))}" /></div>
            <div class="form-group"><label class="flex-row"><input id="stPriv" type="checkbox" ${m.private ? 'checked' : ''} style="width:auto;" /> Private Multiverse</label></div>
            <div class="flex-row">
              <button class="btn btn-primary" onclick="saveRepoSettings('${esc(owner)}','${esc(repo)}')">Save Settings</button>
              <span class="spacer"></span>
              <button class="btn btn-danger" onclick="deleteRepo('${esc(owner)}','${esc(repo)}')">Delete Multiverse</button>
            </div>
          </div>
        </div>
      `;
    }

    async function saveRepoSettings(owner, repo) {
      const topics = document.getElementById("stTopics").value.split(",").map(s => s.trim()).filter(Boolean);
      await api(`/api/v1/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`, {
        method: "PATCH",
        body: JSON.stringify({
          description: document.getElementById("stDesc").value,
          default_branch: document.getElementById("stDef").value,
          private: document.getElementById("stPriv").checked,
          topics,
        }),
      });
      toast("Multiverse settings saved");
      route();
    }

    async function deleteRepo(owner, repo) {
      if (!confirm(`Permanently delete multiverse ${owner}/${repo}?`)) return;
      await api(`/api/v1/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`, { method: "DELETE" });
      toast("Multiverse deleted");
      nav("/");
    }

    (async function boot() {
      await loadMe();
      await route();
    })();
  </script>
</body>
</html>
