<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Draft — Parallel Workspace Code Hosting</title>
  <link rel="icon" type="image/svg+xml" href="/assets/logo.svg" />
  <style>
    :root {
      --bg: #0b0e14;
      --surface: #11151e;
      --surface-2: #161c27;
      --surface-hover: #1c2331;
      --border: #222b3a;
      --border-soft: #1a212e;
      --text: #e6eaf2;
      --text-muted: #8e9bb0;
      --text-dim: #5e6b80;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --accent-soft: rgba(59, 130, 246, 0.14);
      --green: #10b981;
      --green-soft: rgba(16, 185, 129, 0.14);
      --amber: #f59e0b;
      --amber-soft: rgba(245, 158, 11, 0.14);
      --red: #ef4444;
      --red-soft: rgba(239, 68, 68, 0.14);
      --purple: #8b5cf6;
      --purple-soft: rgba(139, 92, 246, 0.14);
      --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
      --sans: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, sans-serif;
    }

    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    code, pre, .mono { font-family: var(--mono); }
    .muted { color: var(--text-muted); }
    .small { font-size: 12px; }

    /* Top Navigation */
    .topbar {
      position: sticky;
      top: 0;
      z-index: 50;
      height: 54px;
      padding: 0 24px;
      background: rgba(11, 14, 20, 0.92);
      backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .topbar-left, .topbar-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 9px;
      color: var(--text);
      font-weight: 700;
      font-size: 15.5px;
      margin-right: 10px;
      text-decoration: none !important;
      cursor: pointer;
    }
    .brand img { width: 24px; height: 24px; border-radius: 6px; }
    .nav-item {
      color: var(--text-muted);
      font-size: 13.5px;
      font-weight: 500;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
      text-decoration: none !important;
      transition: background 0.12s, color 0.12s;
    }
    .nav-item:hover, .nav-item.active {
      color: var(--text);
      background: var(--surface-2);
    }
    .search-box {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 7px;
      padding: 5px 11px;
      font-size: 13px;
      width: 210px;
      outline: none;
    }
    .search-box:focus { border-color: var(--accent); }

    /* Page Container */
    .page {
      max-width: 1180px;
      margin: 0 auto;
      padding: 24px 24px 64px;
    }
    .layout-sidebar {
      display: grid;
      grid-template-columns: 1fr 330px;
      gap: 24px;
      align-items: start;
    }
    .grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }
    @media (max-width: 920px) {
      .layout-sidebar, .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .search-box { display: none; }
    }

    /* Cards */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 16px;
      overflow: hidden;
    }
    .card-head {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
      font-weight: 600;
      font-size: 13.5px;
      background: rgba(22, 28, 39, 0.45);
    }
    .card-body { padding: 16px; }
    .list-row {
      padding: 13px 16px;
      border-bottom: 1px solid var(--border-soft);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .list-row:last-child { border-bottom: none; }
    .list-row:hover { background: rgba(255, 255, 255, 0.015); }

    /* Buttons */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 6px 12px;
      font-size: 13px;
      font-weight: 500;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      cursor: pointer;
      text-decoration: none !important;
      white-space: nowrap;
      transition: background 0.12s, border-color 0.12s;
    }
    .btn:hover { background: var(--surface-hover); border-color: #313f56; }
    .btn-sm { padding: 4px 9px; font-size: 12px; border-radius: 6px; }
    .btn-primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: 600;
    }
    .btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
    .btn-success {
      background: #059669;
      border-color: #10b981;
      color: #fff;
      font-weight: 600;
    }
    .btn-success:hover { background: #047857; }
    .btn-danger {
      background: transparent;
      border-color: rgba(239, 68, 68, 0.4);
      color: #fca5a5;
    }
    .btn-danger:hover { background: var(--red-soft); }

    /* Badges */
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 8px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 500;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text-muted);
      white-space: nowrap;
    }
    .badge-blue { background: var(--accent-soft); border-color: rgba(59,130,246,0.35); color: #93c5fd; }
    .badge-green { background: var(--green-soft); border-color: rgba(16,185,129,0.35); color: #6ee7b7; }
    .badge-amber { background: var(--amber-soft); border-color: rgba(245,158,11,0.35); color: #fcd34d; }
    .badge-red { background: var(--red-soft); border-color: rgba(239,68,68,0.35); color: #fca5a5; }
    .badge-purple { background: var(--purple-soft); border-color: rgba(139,92,246,0.35); color: #c4b5fd; }

    .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
    .dot-green { background: var(--green); }
    .dot-amber { background: var(--amber); }
    .dot-red { background: var(--red); }
    .dot-blue { background: var(--accent); }
    .dot-muted { background: var(--text-dim); }

    /* Repo Header */
    .repo-header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      margin: -24px -24px 22px;
      padding: 18px 24px 0;
    }
    .repo-header-inner {
      max-width: 1180px;
      margin: 0 auto;
    }
    .repo-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 14px;
    }
    .tabs {
      display: flex;
      gap: 4px;
      overflow-x: auto;
    }
    .tab {
      padding: 9px 14px;
      font-size: 13.5px;
      font-weight: 500;
      color: var(--text-muted);
      border-bottom: 2px solid transparent;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      white-space: nowrap;
      transition: color 0.12s;
    }
    .tab:hover { color: var(--text); }
    .tab.active {
      color: var(--text);
      font-weight: 600;
      border-bottom-color: var(--accent);
    }
    .tab-count {
      font-size: 11px;
      padding: 1px 6px;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--text-muted);
    }

    /* Workspace Switcher Strip (The Heart of Draft!) */
    .ws-strip {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      margin-bottom: 14px;
    }
    .ws-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 11px;
      border-radius: 7px;
      font-size: 12.5px;
      font-weight: 500;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.12s;
    }
    .ws-pill:hover { background: var(--surface-2); color: var(--text); }
    .ws-pill.active {
      background: var(--surface-2);
      border-color: var(--accent);
      color: var(--text);
      font-weight: 600;
    }

    /* Notice / Status Banner */
    .status-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 11px 16px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surface);
      margin-bottom: 14px;
    }
    .status-bar.clean { border-color: rgba(16,185,129,0.4); background: rgba(16,185,129,0.06); }
    .status-bar.conflict { border-color: rgba(239,68,68,0.4); background: rgba(239,68,68,0.06); }

    /* File Explorer Table */
    .file-table { width: 100%; border-collapse: collapse; }
    .file-table td {
      padding: 9px 14px;
      border-bottom: 1px solid var(--border-soft);
      font-size: 13.5px;
    }
    .file-table tr:last-child td { border-bottom: none; }
    .file-table tr:hover td { background: rgba(255,255,255,0.02); }

    /* Code & Diff */
    .code-view { width: 100%; border-collapse: collapse; font-family: var(--mono); font-size: 12.5px; line-height: 1.55; }
    .code-ln {
      width: 48px;
      text-align: right;
      padding: 0 12px;
      color: var(--text-dim);
      user-select: none;
      border-right: 1px solid var(--border-soft);
    }
    .code-txt { padding: 0 14px; white-space: pre; }
    .diff-wrap {
      font-family: var(--mono);
      font-size: 12px;
      line-height: 1.55;
      background: #080b10;
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow-x: auto;
    }
    .diff-ln { padding: 1px 12px; white-space: pre; }
    .diff-add { background: rgba(16, 185, 129, 0.14); color: #6ee7b7; }
    .diff-del { background: rgba(239, 68, 68, 0.14); color: #fca5a5; }
    .diff-hunk { background: rgba(59, 130, 246, 0.12); color: #93c5fd; }
    .diff-hdr { color: var(--text-muted); background: rgba(255,255,255,0.03); font-weight: 600; }

    /* Forms */
    input[type="text"], input[type="password"], input[type="email"], select, textarea {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      border-radius: 7px;
      padding: 8px 11px;
      font-size: 13.5px;
      font-family: inherit;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: var(--accent); }
    textarea.editor { font-family: var(--mono); font-size: 12.5px; min-height: 320px; line-height: 1.55; }
    .field { margin-bottom: 13px; }
    .label { display: block; font-size: 12.5px; font-weight: 600; color: var(--text-muted); margin-bottom: 5px; }

    .cmd-box {
      background: #080b10;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-family: var(--mono);
      font-size: 12px;
      color: #cbd5e1;
      overflow-x: auto;
      margin: 0;
    }

    /* Segmented Sub-nav */
    .subnav {
      display: inline-flex;
      gap: 4px;
      padding: 4px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .subnav-btn {
      padding: 5px 12px;
      border-radius: 6px;
      font-size: 12.5px;
      font-weight: 500;
      color: var(--text-muted);
      cursor: pointer;
      border: none;
      background: transparent;
    }
    .subnav-btn.active { background: var(--surface-2); color: var(--text); font-weight: 600; }

    /* Dropdowns & Modal */
    .dropdown { position: relative; }
    .dropdown-menu {
      position: absolute;
      right: 0;
      top: calc(100% + 6px);
      min-width: 200px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 5px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.5);
      display: none;
      z-index: 80;
    }
    .dropdown.open .dropdown-menu { display: block; }
    .dropdown-item {
      padding: 7px 10px;
      border-radius: 6px;
      font-size: 13px;
      color: var(--text);
      cursor: pointer;
    }
    .dropdown-item:hover { background: var(--surface-hover); }

    .modal-bg {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .modal-bg.open { display: flex; }
    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 11px;
      width: 100%;
      max-width: 780px;
      max-height: 86vh;
      display: flex;
      flex-direction: column;
      box-shadow: 0 20px 50px rgba(0,0,0,0.65);
    }
    .modal-head {
      padding: 13px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-weight: 600;
    }
    .modal-body { padding: 18px; overflow-y: auto; }

    /* Toast */
    .toasts { position: fixed; bottom: 18px; right: 18px; z-index: 150; display: flex; flex-direction: column; gap: 8px; }
    .toast {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      color: var(--text);
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.45);
    }
    .toast.err { border-left-color: var(--red); }

    /* Markdown */
    .md { font-size: 14px; line-height: 1.68; color: var(--text); }
    .md > *:first-child { margin-top: 0; }
    .md h1, .md h2, .md h3 { border-bottom: 1px solid var(--border-soft); padding-bottom: 6px; margin: 22px 0 12px; line-height: 1.3; }
    .md h1 { font-size: 22px; }
    .md h2 { font-size: 17.5px; }
    .md h3 { font-size: 15px; border-bottom: none; padding-bottom: 0; }
    .md h4 { font-size: 14px; margin: 16px 0 8px; }
    .md p { margin: 10px 0; }
    .md ul, .md ol { margin: 8px 0 12px; padding-left: 22px; }
    .md li { margin: 4px 0; }
    .md hr { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
    .md blockquote { margin: 12px 0; padding: 6px 14px; border-left: 3px solid var(--accent); color: var(--text-muted); background: rgba(255,255,255,0.02); border-radius: 0 6px 6px 0; }
    .md pre { background: #080b10; border: 1px solid var(--border); padding: 13px 15px; border-radius: 8px; overflow-x: auto; line-height: 1.45; margin: 12px 0; }
    .md code { font-family: var(--mono); background: rgba(255,255,255,0.07); padding: 2px 5px; border-radius: 4px; font-size: 12.5px; }
    .md pre code { background: none; padding: 0; font-size: 12.5px; }
    .md-table-wrap { overflow-x: auto; margin: 14px 0; border: 1px solid var(--border); border-radius: 8px; }
    .md table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    .md th, .md td { padding: 9px 13px; border-bottom: 1px solid var(--border-soft); text-align: left; vertical-align: top; }
    .md th { background: var(--surface-2); font-weight: 600; border-bottom: 1px solid var(--border); white-space: nowrap; }
    .md tr:last-child td { border-bottom: none; }
    .md tr:hover td { background: rgba(255,255,255,0.015); }

    .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .spacer { flex: 1; }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="topbar-left">
      <a class="brand" href="/" onclick="nav('/'); return false;">
        <img src="/assets/logo.svg" alt="Draft" />
        <span>Draft</span>
        <span class="badge small">v__VERSION__</span>
      </a>
      <a class="nav-item" href="/explore" onclick="nav('/explore'); return false;">Projects</a>
      <a class="nav-item" href="/pulls" onclick="nav('/pulls'); return false;">Merge Requests</a>
      <a class="nav-item" href="/issues" onclick="nav('/issues'); return false;">Tasks</a>
      <a class="nav-item" href="#" onclick="openGuideModal(); return false;">CLI &amp; AI Guide</a>
    </div>
    <div class="topbar-right">
      <input class="search-box" type="text" placeholder="Search projects..." onkeydown="if(event.key==='Enter') nav('/explore?q='+encodeURIComponent(this.value))" />
      <div class="dropdown" id="newMenu">
        <button class="btn btn-sm btn-primary" onclick="toggleMenu('newMenu')">+ New ▾</button>
        <div class="dropdown-menu">
          <div class="dropdown-item" onclick="closeMenus(); nav('/repo/create')">New Project</div>
          <div class="dropdown-item" onclick="closeMenus(); nav('/repo/migrate')">Import Git Repository</div>
          <div class="dropdown-item" onclick="closeMenus(); nav('/org/create')">New Organization</div>
        </div>
      </div>
      <div id="userMenuArea"></div>
    </div>
  </header>

  <main class="page" id="app">
    <div class="muted">Loading...</div>
  </main>

  <div class="modal-bg" id="modalBg" onclick="if(event.target===this) closeModal()">
    <div class="modal">
      <div class="modal-head">
        <span id="modalTitle">Details</span>
        <button class="btn btn-sm" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modalBody"></div>
    </div>
  </div>

  <div class="toasts" id="toasts"></div>

  <script>
    const SERVER_URL = "__SERVER_URL__";
    const STATE = { me: null, orgs: [], tokens: [], ov: null, radar: null };

    document.addEventListener("click", e => {
      if (!e.target.closest(".dropdown")) closeMenus();
    });

    function toggleMenu(id) {
      const el = document.getElementById(id);
      if (!el) return;
      const open = el.classList.contains("open");
      closeMenus();
      if (!open) el.classList.add("open");
    }
    function closeMenus() {
      document.querySelectorAll(".dropdown.open").forEach(el => el.classList.remove("open"));
    }

    function openModal(title, html) {
      document.getElementById("modalTitle").innerHTML = title;
      document.getElementById("modalBody").innerHTML = html;
      document.getElementById("modalBg").classList.add("open");
    }
    function closeModal() {
      document.getElementById("modalBg").classList.remove("open");
    }

    function toast(msg, err = false) {
      const wrap = document.getElementById("toasts");
      const d = document.createElement("div");
      d.className = "toast" + (err ? " err" : "");
      d.textContent = msg;
      wrap.appendChild(d);
      setTimeout(() => d.remove(), 3800);
    }

    function copyText(txt, msg = "Copied to clipboard") {
      if (navigator.clipboard) navigator.clipboard.writeText(txt).then(() => toast(msg));
    }

    function esc(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function fmtBytes(n) {
      n = Number(n || 0);
      if (n < 1024) return n + " B";
      if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
      return (n / 1048576).toFixed(2) + " MB";
    }

    function timeAgo(ts) {
      if (!ts) return "";
      const d = typeof ts === "number" ? new Date(ts * 1000) : new Date(ts);
      if (isNaN(d.getTime())) return String(ts);
      const sec = Math.max(1, Math.floor((Date.now() - d.getTime()) / 1000));
      if (sec < 60) return "just now";
      if (sec < 3600) return Math.floor(sec / 60) + "m ago";
      if (sec < 86400) return Math.floor(sec / 3600) + "h ago";
      return Math.floor(sec / 86400) + "d ago";
    }

    function fmtInline(raw) {
      const codes = [];
      let s = String(raw ?? "").replace(/`([^`\n]+)`/g, (_, c) => {
        codes.push(`<code>${esc(c)}</code>`);
        return `\x00IC${codes.length - 1}\x00`;
      });
      s = esc(s);
      s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
      s = s.replace(/(^|[\s(])\*([^*\n]+)\*(?=[\s).,;:!?]|$)/g, "$1<em>$2</em>");
      s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+|\/[^\s)]+)\)/g, `<a href="$2" target="_blank" rel="noopener">$1</a>`);
      s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, `$1<a href="$2" target="_blank" rel="noopener">$2</a>`);
      return s.replace(/\x00IC(\d+)\x00/g, (_, idx) => codes[Number(idx)] || "");
    }

    function renderMd(md) {
      if (!md) return "";
      const codeBlocks = [];
      const src = String(md).replace(/\r\n/g, "\n").replace(/```([a-zA-Z0-9_-]*)\n([\s\S]*?)```/g, (_, _lang, code) => {
        codeBlocks.push(`<pre><code>${esc(code.replace(/\n$/, ""))}</code></pre>`);
        return `\n@@CODEBLOCK_${codeBlocks.length - 1}@@\n`;
      });

      const lines = src.split("\n");
      const out = [];
      let i = 0;

      const splitRow = ln => ln.trim().replace(/^\|/, "").replace(/\|$/, "").split("|").map(c => c.trim());
      const isSepRow = ln => /^\s*\|?(\s*:?-{3,}:?\s*\|)+\s*:?-{3,}:?\s*\|?\s*$/.test(ln);

      while (i < lines.length) {
        const ln = lines[i];
        const trimmed = ln.trim();
        if (!trimmed) { i++; continue; }

        const cbMatch = trimmed.match(/^@@CODEBLOCK_(\d+)@@$/);
        if (cbMatch) {
          out.push(codeBlocks[Number(cbMatch[1])] || "");
          i++;
          continue;
        }

        if (/^(-{3,}|\*{3,}|_{3,})$/.test(trimmed)) {
          out.push("<hr />");
          i++;
          continue;
        }

        const hMatch = trimmed.match(/^(#{1,4})\s+(.*)$/);
        if (hMatch) {
          const lvl = hMatch[1].length;
          out.push(`<h${lvl}>${fmtInline(hMatch[2])}</h${lvl}>`);
          i++;
          continue;
        }

        if (trimmed.includes("|") && i + 1 < lines.length && isSepRow(lines[i + 1])) {
          const headers = splitRow(ln);
          i += 2;
          const rows = [];
          while (i < lines.length && lines[i].trim().includes("|") && lines[i].trim() !== "") {
            rows.push(splitRow(lines[i]));
            i++;
          }
          out.push(
            `<div class="md-table-wrap"><table><thead><tr>${headers.map(h => `<th>${fmtInline(h)}</th>`).join("")}</tr></thead><tbody>` +
            rows.map(r => `<tr>${headers.map((_, idx) => `<td>${fmtInline(r[idx] || "")}</td>`).join("")}</tr>`).join("") +
            `</tbody></table></div>`
          );
          continue;
        }

        if (trimmed.startsWith(">")) {
          const qLines = [];
          while (i < lines.length && lines[i].trim().startsWith(">")) {
            qLines.push(fmtInline(lines[i].trim().replace(/^>\s?/, "")));
            i++;
          }
          out.push(`<blockquote>${qLines.join("<br />")}</blockquote>`);
          continue;
        }

        if (/^\s*[-*]\s+/.test(ln)) {
          const items = [];
          while (i < lines.length && /^\s*[-*]\s+/.test(lines[i])) {
            const indent = (lines[i].match(/^(\s*)/)[1] || "").length;
            const txt = fmtInline(lines[i].replace(/^\s*[-*]\s+/, ""));
            items.push(`<li style="${indent >= 2 ? 'margin-left:18px;' : ''}">${txt}</li>`);
            i++;
          }
          out.push(`<ul>${items.join("")}</ul>`);
          continue;
        }

        if (/^\s*\d+\.\s+/.test(ln)) {
          const items = [];
          while (i < lines.length && /^\s*\d+\.\s+/.test(lines[i])) {
            items.push(`<li>${fmtInline(lines[i].replace(/^\s*\d+\.\s+/, ""))}</li>`);
            i++;
          }
          out.push(`<ol>${items.join("")}</ol>`);
          continue;
        }

        const pLines = [];
        while (
          i < lines.length &&
          lines[i].trim() !== "" &&
          !/^@@CODEBLOCK_\d+@@$/.test(lines[i].trim()) &&
          !/^(-{3,}|\*{3,}|_{3,})$/.test(lines[i].trim()) &&
          !/^#{1,4}\s+/.test(lines[i].trim()) &&
          !lines[i].trim().startsWith(">") &&
          !/^\s*[-*]\s+/.test(lines[i]) &&
          !/^\s*\d+\.\s+/.test(lines[i]) &&
          !(lines[i].trim().includes("|") && i + 1 < lines.length && isSepRow(lines[i + 1]))
        ) {
          pLines.push(fmtInline(lines[i].trim()));
          i++;
        }
        if (pLines.length > 0) out.push(`<p>${pLines.join(" ")}</p>`);
      }

      return `<div class="md">${out.join("\n")}</div>`;
    }

    function renderDiff(diff) {
      if (!diff || !diff.trim()) return `<div class="muted" style="padding:12px;">No file differences.</div>`;
      return `<div class="diff-wrap">${diff.split("\n").map(l => {
        let c = "diff-ln";
        if (l.startsWith("+++") || l.startsWith("---") || l.startsWith("diff ")) c += " diff-hdr";
        else if (l.startsWith("@@")) c += " diff-hunk";
        else if (l.startsWith("+")) c += " diff-add";
        else if (l.startsWith("-")) c += " diff-del";
        return `<div class="${c}">${esc(l) || " "}</div>`;
      }).join("")}</div>`;
    }

    function mergeStatusBadge(foresee) {
      if (!foresee || !foresee.valid) return `<span class="badge">Unknown</span>`;
      if (foresee.has_conflicts) {
        const cnt = (foresee.conflicting_files || []).length;
        return `<span class="badge badge-red"><span class="dot dot-red"></span>${cnt} file conflict${cnt > 1 ? "s" : ""}</span>`;
      }
      if (Number(foresee.entropy || 0) === 0) {
        return `<span class="badge"><span class="dot dot-muted"></span>In sync with main</span>`;
      }
      return `<span class="badge badge-green"><span class="dot dot-green"></span>Ready to merge</span>`;
    }

    async function api(url, opts = {}) {
      const headers = Object.assign({ "Content-Type": "application/json" }, opts.headers || {});
      const res = await fetch(url, Object.assign({}, opts, { headers }));
      const ct = res.headers.get("content-type") || "";
      const body = ct.includes("application/json") ? await res.json() : await res.text();
      if (!res.ok) throw new Error((body && body.error) ? body.error : `HTTP ${res.status}`);
      return body;
    }

        const owner = decodeURIComponent(segs[0]);
        const repo = decodeURIComponent(segs[1]).replace(/\.dft$/, "");
        return renderRepo(owner, repo, params);

              <div class="row">
                ${mergeStatusBadge(f)}
                <span>Workspace <strong>${esc(ref)}</strong> has changes ready to merge cleanly into <code>${esc(def)}</code>.</span>
              </div>
              <div class="row">
                <button class="btn btn-sm" onclick="nav('/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}?tab=pulls&new=1&head=${encodeURIComponent(ref)}&base=${encodeURIComponent(def)}')">Review Changes</button>
                <button class="btn btn-sm btn-success" onclick="mergeWorkspaceNow('${esc(owner)}','${esc(repo)}','${esc(ref)}')">Merge into ${esc(def)}</button>
              </div>
            </div>
          `;
        }
      }

      if (isNewFile) {
        const prefix = params.get("dir") ? params.get("dir") + "/" : "";
        box.innerHTML = wsStrip + `
          <div class="card">
            <div class="card-head">New File in <code>${esc(ref)}</code></div>
            <div class="card-body">
              <div class="field"><label class="label">File Path</label><input id="fPath" type="text" value="${esc(prefix)}" placeholder="src/main.rs" /></div>
              <div class="field"><label class="label">Content</label><textarea id="fBody" class="editor"></textarea></div>
              <div class="field"><label class="label">Commit Message</label><input id="fMsg" type="text" placeholder="Add new file" /></div>
              <div class="row">
                <button class="btn btn-primary" onclick="saveFile('${esc(owner)}','${esc(repo)}','${esc(ref)}')">Save &amp; Commit</button>
                <button class="btn" onclick="history.back()">Cancel</button>
              </div>
            </div>
          </div>
        `;
        return;
      }

      if (filePath) {
        const blob = await api(`/api/v1/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/blob?ref=${encodeURIComponent(ref)}&path=${encodeURIComponent(filePath)}`);
        if (isEdit) {
          box.innerHTML = wsStrip + `
            <div class="card">
              <div class="card-head">Editing <code>${esc(filePath)}</code> in <code>${esc(ref)}</code></div>
              <div class="card-body">
                <input id="fPath" type="hidden" value="${esc(filePath)}" />
                <div class="field"><textarea id="fBody" class="editor">${esc(blob.content || "")}</textarea></div>
                <div class="field"><label class="label">Commit Message</label><input id="fMsg" type="text" value="Update ${esc(filePath)}" /></div>
                <div class="row">
                  <button class="btn btn-primary" onclick="saveFile('${esc(owner)}','${esc(repo)}','${esc(ref)}')">Commit Changes</button>
                  <button class="btn" onclick="nav('/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}?tab=code&ref=${encodeURIComponent(ref)}&blob=${encodeURIComponent(filePath)}')">Cancel</button>
                </div>
              </div>
            </div>
          `;
          return;
        }

        const lines = (blob.content || "").split("\n");
        box.innerHTML = wsStrip + wsBanner + `
          <div class="card">
            <div class="card-head">
              <div class="row">
                <a href="/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}?tab=code&ref=${encodeURIComponent(ref)}" onclick="nav('/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}?tab=code&ref=${encodeURIComponent(ref)}'); return false;">${esc(repo)}</a>
                <span class="muted">/</span>
                <strong>${esc(filePath)}</strong>
                <span class="muted small">${blob.lines || 0} lines · ${fmtBytes(blob.size)}</span>
              </div>
              <div class="row">
                <button class="btn btn-sm" onclick="compareFileAcrossWorkspaces('${esc(owner)}','${esc(repo)}','${esc(filePath)}')">Compare Across Workspaces</button>
                ${!blob.is_binary ? `<button class="btn btn-sm" onclick="nav('/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}?tab=code&ref=${encodeURIComponent(ref)}&blob=${encodeURIComponent(filePath)}&edit=1')">Edit</button>` : ""}
                <a class="btn btn-sm" href="${esc(blob.raw_url)}" target="_blank">Raw</a>
                <button class="btn btn-sm btn-danger" onclick="deleteFile('${esc(owner)}','${esc(repo)}','${esc(ref)}','${esc(filePath)}')">Delete</button>
              </div>
            </div>
            <div style="overflow-x:auto;">
              ${blob.is_binary

                : `<table class="code-view"><tbody>${lines.map((l, i) => `<tr><td class="code-ln">${i + 1}</td><td class="code-txt">${esc(l)}</td></tr>`).join("")}</tbody></table>`
              }
            </div>
          </div>
        `;
        return;
      }

      // Directory Listing
      const tree = await api(`/api/v1/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/tree?ref=${encodeURIComponent(ref)}&path=${encodeURIComponent(dirPath)}`);
      const claims = (radar.territory && radar.territory.claims) || {};
      const fences = (radar.territory && radar.territory.fences) || [];
      const hotZones = radar.hot_zones || [];

      const getIndicators = (p, isDir) => {
        const out = [];
        const hz = hotZones.find(h => isDir ? h.path.startsWith(p + "/") : h.path === p);
        if (hz) out.push(`<span class="badge badge-amber" title="Edited in multiple workspaces: ${(hz.dimensions||[]).join(', ')}">Edited in ${hz.touch_count} workspaces</span>`);
        Object.values(claims).forEach(c => {
          const cp = (c.path || "").replace(/\/+$/, "");
          if (cp && (p === cp || p.startsWith(cp + "/"))) out.push(`<span class="badge badge-purple">In use by ${esc(c.agent || c.dimension)}</span>`);
        });
        fences.forEach(f => {
          const fp = (f.path || "").replace(/\*+$/, "").replace(/\/+$/, "");
          if (fp && (p === fp || p.startsWith(fp + "/"))) out.push(`<span class="badge badge-red" title="Protected file">Locked (${esc(f.dimension)})</span>`);
        });
        return out.slice(0, 2).join(" ");
      };

      const lc = tree.latest_commit;
      const parentDir = dirPath.includes("/") ? dirPath.split("/").slice(0, -1).join("/") : "";

      box.innerHTML = wsStrip + wsBanner + `
        <div class="card">
          <div class="card-head" style="font-weight:400;">
            <div class="row">
              ${lc ? `<strong>${esc(lc.author || lc.author_name)}</strong> <span class="muted">${esc(lc.summary)}</span>` : `<span class="muted">Files</span>`}
              ${dirPath ? `<span class="badge mono">/${esc(dirPath)}</span>` : ""}
            </div>
            <div class="row">
              ${lc ? `<a class="mono small muted" href="#" onclick="showCommitModal('${esc(owner)}','${esc(repo)}','${esc(lc.hash || lc.id)}'); return false;">${esc(lc.short_hash || lc.short_id)} · ${timeAgo(lc.timestamp)}</a>` : ""}
              <button class="btn btn-sm" onclick="nav('/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}?tab=code&newfile=1&ref=${encodeURIComponent(ref)}&dir=${encodeURIComponent(dirPath)}')">+ New File</button>
            </div>
          </div>
          <table class="file-table">
            <tbody>
              ${dirPath ? `
                <tr style="cursor:pointer;" onclick="nav('/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}?tab=code&ref=${encodeURIComponent(ref)}&path=${encodeURIComponent(parentDir)}')">
                  <td colspan="3">📁 <a>..</a></td>
                </tr>
              ` : ""}
              ${(tree.entries || []).map(e => {
                const url = e.is_dir
                  ? `/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}?tab=code&ref=${encodeURIComponent(ref)}&path=${encodeURIComponent(e.path)}`
                  : `/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}?tab=code&ref=${encodeURIComponent(ref)}&blob=${encodeURIComponent(e.path)}`;
                return `
                  <tr style="cursor:pointer;" onclick="nav('${url}')">
                    <td>
                      <span style="margin-right:8px;">${e.is_dir ? "📁" : "📄"}</span>
                      <a href="${url}" onclick="event.stopPropagation(); nav('${url}'); return false;" style="color:var(--text); font-weight:${e.is_dir ? '600' : '400'};">${esc(e.name)}</a>
                      <span style="margin-left:8px;">${getIndicators(e.path, e.is_dir)}</span>
                    </td>
                    <td class="muted small" style="text-align:right; width:100px;">${e.is_dir ? "" : fmtBytes(e.size)}</td>
                    <td style="text-align:right; width:110px;">
                      ${!e.is_dir && dims.length > 0 ? `<button class="btn btn-sm" onclick="event.stopPropagation(); compareFileAcrossWorkspaces('${esc(owner)}','${esc(repo)}','${esc(e.path)}')">Compare</button>` : ""}
                    </td>
                  </tr>
                `;
              }).join("")}
            </tbody>
          </table>
        </div>

        ${tree.readme ? `
          <div class="card">
            <div class="card-head">${esc(tree.readme_name || "README.md")}</div>
            <div class="card-body">${renderMd(tree.readme)}</div>
          </div>
        ` : ""}
      `;
    }

    async function renderNewMergeForm(owner, repo, ov, params, box) {
      const def = ov.meta.default_branch;
      const refs = [def, ...(ov.dimensions || []).map(d => d.name), ...(ov.branches || []).map(b => b.name).filter(n => n !== def)];
      const base = params.get("base") || def;
      const head = params.get("head") || (refs.find(r => r !== base) || base);
      const cmp = head !== base
        ? await api(`/api/v1/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/compare?base=${encodeURIComponent(base)}&head=${encodeURIComponent(head)}`).catch(() => null)
        : null;

      box.innerHTML = `
        <div class="card">
          <div class="card-head">Compare &amp; Create Merge Request</div>
          <div class="card-body">
            <div class="row" style="margin-bottom:14px;">
              <span class="muted">Merge from:</span>
              <select id="mrHead" style="width:210px;" onchange="refreshCompare('${esc(owner)}','${esc(repo)}')">
                ${refs.map(r => `<option value="${esc(r)}" ${r===head?'selected':''}>${esc(r)}</option>`).join("")}
              </select>
              <span class="muted">into:</span>
              <select id="mrBase" style="width:210px;" onchange="refreshCompare('${esc(owner)}','${esc(repo)}')">
                ${refs.map(r => `<option value="${esc(r)}" ${r===base?'selected':''}>${esc(r)}</option>`).join("")}
              </select>
              ${cmp?.foresee ? mergeStatusBadge(cmp.foresee) : ""}
            </div>
            <div class="field"><label class="label">Title</label><input id="mrTitle" type="text" value="Merge ${esc(head)} into ${esc(base)}" /></div>
            <div class="field"><label class="label">Description (optional)</label><textarea id="mrBody" rows="3" placeholder="Summary of changes..."></textarea></div>
            <div class="row">
              <button class="btn btn-primary" onclick="createMergeReq('${esc(owner)}','${esc(repo)}')">Create Merge Request</button>
              <button class="btn" onclick="nav('/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}?tab=pulls')">Cancel</button>
            </div>
          </div>
        </div>
        ${cmp ? `
          <div class="card">
            <div class="card-head">Changes (${cmp.stats?.files_changed || 0} files, +${cmp.stats?.additions || 0} / -${cmp.stats?.deletions || 0})</div>
            <div class="card-body">${renderDiff(cmp.diff)}</div>
          </div>
        ` : ""}
      `;
    }

    function refreshCompare(owner, repo) {
      const h = document.getElementById("mrHead").value;
      const b = document.getElementById("mrBase").value;
      nav(`/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}?tab=pulls&new=1&head=${encodeURIComponent(h)}&base=${encodeURIComponent(b)}`);
    }

    async function createMergeReq(owner, repo) {
      try {
        const pr = await api(`/api/v1/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/pulls`, {
          method: "POST",
          body: JSON.stringify({
            head_ref: document.getElementById("mrHead").value,
            base_ref: document.getElementById("mrBase").value,
            title: document.getElementById("mrTitle").value,
            body: document.getElementById("mrBody").value,
          }),
        });
        nav(`/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}?tab=pulls&pr=${pr.number}`);
      } catch (e) { toast(e.message, true); }
    }

                <button class="btn btn-danger" onclick="closeMergeReq('${esc(owner)}','${esc(repo)}',${pr.number})">Close</button>

          <div class="card-body">${renderDiff(cmp.diff)}</div>

        <div class="card">
          <div class="card-head">Comments (${(pr.comments || []).length})</div>
          <div class="card-body">
            ${(pr.comments || []).map(c => `<div style="padding:8px 0; border-bottom:1px solid var(--border-soft);"><strong>${esc(c.author)}</strong> <span class="muted small">${timeAgo(c.created_at)}</span><div style="margin-top:3px;">${esc(c.body)}</div></div>`).join("")}
            <div class="row" style="margin-top:10px;">
              <input id="mrComment" type="text" placeholder="Write a comment..." style="flex:1;" />
              <button class="btn btn-primary" onclick="postMergeComment('${esc(owner)}','${esc(repo)}',${pr.number})">Comment</button>
            </div>
          </div>
        </div>
      `;
    }

    // -------------------------------------------------------------------------
    // Tab 4: AGENTS & FILE LOCKS — Clean Segmented View (Locks / Auto-Sync / Agents)
    // -------------------------------------------------------------------------
    function renderAgentsAndLocksView(owner, repo, ov, radar, sec) {
      const box = document.getElementById("tabContent");
      const def = ov.meta.default_branch;
      const dims = [def, ...(ov.dimensions || []).map(d => d.name)];
      const hot = radar.hot_zones || [];
      const claims = Object.values((radar.territory && radar.territory.claims) || {});
      const fences = (radar.territory && radar.territory.fences) || [];
      const rules = radar.entanglements || [];
      const agents = radar.agents || [];
      const msgs = radar.messages || [];

      const navSec = s => `nav('/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}?tab=agents&sec=${s}')`;

      let content = "";
      if (sec === "locks") {

                  <span class="muted">↔</span>
                  <span class="badge badge-blue">${esc(r.dim2)}</span>
                  <code>${esc(r.paths)}</code>
                  <span class="spacer"></span>
                  <button class="btn btn-sm btn-danger" onclick="removeAutoSync('${esc(owner)}','${esc(repo)}','${esc(r.id)}')">Remove</button>

            <div class="card">
              <div class="card-head">Registered AI Agents &amp; Workers (${agents.length})</div>
              <div class="card-body">
                <div class="grid-2" style="margin-bottom:8px;">

                    <button class="btn btn-sm" onclick="pingAgent('${esc(owner)}','${esc(repo)}','${esc(a.name || a.id)}')">Ping</button>

                  <div>

                      <a style="font-weight:600;" href="/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}?tab=issues&issue=${i.number}" onclick="nav('/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}?tab=issues&issue=${i.number}'); return false;">
                        #${i.number} ${esc(i.title)}
                      </a>
                      ${i.assignee ? `<span class="badge badge-purple">${esc(i.assignee)}</span>` : ""}
                    </div>
                    <div class="muted small" style="margin-top:3px;">Opened by ${esc(i.author)} · ${timeAgo(i.updated_at)}</div>

    function openNewWorkspaceModal(owner, repo, fromRef) {
      openModal(
        "Create New Parallel Workspace",
        `
          <p class="muted small" style="margin-top:0;">Creates an isolated workspace branching from <code>${esc(fromRef)}</code> so you or an AI agent can work in parallel.</p>
          <div class="field"><label class="label">Workspace Name</label><input id="nwName" type="text" placeholder="e.g. feature-login or agent-ui" /></div>
          <div class="field"><label class="label">Start From</label><input id="nwFrom" type="text" value="${esc(fromRef)}" /></div>
          <button class="btn btn-primary" onclick="createWorkspace('${esc(owner)}','${esc(repo)}')">Create Workspace</button>
        `
      );
    }

    async function createWorkspace(owner, repo) {
      try {
        const name = document.getElementById("nwName").value.trim();
        const from_ref = document.getElementById("nwFrom").value.trim();
        await api(`/api/v1/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/refs`, {
          method: "POST",
          body: JSON.stringify({ kind: "dimension", name, from_ref }),
        });
        closeModal();
        toast(`Created workspace '${name}'`);
        nav(`/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}?tab=code&ref=${encodeURIComponent(name)}`);
      } catch (e) { toast(e.message, true); }
    }

    async function deleteWorkspace(owner, repo, name) {
      if (!confirm(`Delete workspace '${name}'?`)) return;
      await api(`/api/v1/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/refs?kind=dimension&name=${encodeURIComponent(name)}`, { method: "DELETE" });
      toast(`Deleted workspace '${name}'`);
      route();
    }

    async function mergeWorkspaceNow(owner, repo, dim) {
      try {
        const res = await api(`/api/v1/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/converge`, {
          method: "POST",
          body: JSON.stringify({ dimensions: [dim], dry_run: false }),
        });
        if ((res.skipped_conflicting || []).length > 0) {
          toast(`Cannot auto-merge '${dim}' due to file conflicts`, true);
        } else {
          toast(`Merged '${dim}' into ${res.target}`);
          route();
        }
      } catch (e) { toast(e.message, true); }
    }

    async function mergeAllCleanWorkspaces(owner, repo) {
      try {
        const res = await api(`/api/v1/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/collapse`, {
          method: "POST",
          body: JSON.stringify({ dry_run: false }),
        });
        toast(`Merged ${(res.converged_dimensions || []).length} workspace(s) into ${res.target}`);
        route();
      } catch (e) { toast(e.message, true); }
    }

    async function syncMainToAll(owner, repo) {
      try {
        const res = await api(`/api/v1/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/cascade`, { method: "POST", body: "{}" });
        toast(`Synced main into ${(res.propagated_dimensions || []).length} workspace(s)`);
        route();
      } catch (e) { toast(e.message, true); }
    }

    async function saveCheckpoint(owner, repo) {
      const res = await api(`/api/v1/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/snapshots`, {
        method: "POST",
        body: JSON.stringify({ all: true }),
      });
      toast(`Saved ${res.created?.length || 0} backup snapshot(s)`);
    }

    async function compareFileAcrossWorkspaces(owner, repo, filePath) {
      try {
        const d = await api(`/api/v1/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/observe?path=${encodeURIComponent(filePath)}`);
        const obs = d.observations || [];
        openModal(
          `Compare Across Workspaces — <code>${esc(d.path)}</code>`,
          obs.map(o => `
            <div class="card">
              <div class="card-head">
                <div class="row">
                  <strong>${esc(o.dimension)}</strong>
                  ${o.exists ? `<span class="muted small">${o.lines} lines · ${fmtBytes(o.size)}</span>` : `<span class="badge">Not in this workspace</span>`}
                </div>
                ${o.exists ? `<button class="btn btn-sm" onclick="closeModal(); nav('/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}?tab=code&ref=${encodeURIComponent(o.dimension)}&blob=${encodeURIComponent(d.path)}')">Open</button>` : ""}
              </div>
              ${o.exists ? `<pre class="cmd-box" style="max-height:180px; overflow:auto; border:none; border-radius:0;">${esc(o.content)}</pre>` : ""}
            </div>
          `).join("")
        );
      } catch (e) { toast(e.message, true); }
    }

            ${renderDiff(d.diff)}

          method: "POST",
          body: JSON.stringify({
            branch,
            path,
            content: document.getElementById("fBody").value,
            message: document.getElementById("fMsg").value.trim(),
            action: "write",
          }),

        nav(`/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}?tab=code&ref=${encodeURIComponent(branch)}&blob=${encodeURIComponent(path)}`);
      } catch (e) { toast(e.message, true); }

      try {
        await api(`/api/v1/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/contents`, {
          method: "POST",
          body: JSON.stringify({ branch, path, action: "delete" }),
        });
        toast("File deleted");
        nav(`/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}?tab=code&ref=${encodeURIComponent(branch)}`);
      } catch (e) { toast(e.message, true); }

        await api(`/api/v1/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/pulls/${num}/merge`, { method: "POST", body: "{}" });
        toast("Merged cleanly");
        route();

      route();

    async function addClaim(owner, repo) {
      try {
        await api(`/api/v1/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/territory/claim`, {
          method: "POST",
          body: JSON.stringify({
            path: document.getElementById("clPath").value,
            dimension: document.getElementById("clDim").value,
            agent: document.getElementById("clAgent").value,
          }),
        });
        route();
      } catch (e) { toast(e.message, true); }
    }
    async function releaseClaim(owner, repo, path) {
      await api(`/api/v1/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/territory/yield`, { method: "POST", body: JSON.stringify({ path }) });
      route();
    }
    async function addFence(owner, repo) {
      try {
        await api(`/api/v1/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/territory/fence`, {
          method: "POST",
          body: JSON.stringify({
            path: document.getElementById("fnPath").value,
            dimension: document.getElementById("fnDim").value,
            reason: document.getElementById("fnReason").value,
            action: "add",
          }),
        });
        route();
      } catch (e) { toast(e.message, true); }
    }
    async function removeFence(owner, repo, path) {
      await api(`/api/v1/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/territory/fence`, { method: "POST", body: JSON.stringify({ path, action: "remove" }) });
      route();
    }

    async function addAutoSync(owner, repo) {
      try {
        await api(`/api/v1/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/entangle`, {
          method: "POST",
          body: JSON.stringify({
            dim1: document.getElementById("enD1").value,
            dim2: document.getElementById("enD2").value,
            paths: document.getElementById("enPath").value,
          }),
        });
        toast("Auto-sync linked");
        route();
      } catch (e) { toast(e.message, true); }
    }
    async function removeAutoSync(owner, repo, id) {
      await api(`/api/v1/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/entangle/${encodeURIComponent(id)}`, { method: "DELETE" });
      route();
    }
    async function runAutoSyncNow(owner, repo) {
      const r = await api(`/api/v1/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/cronos`, { method: "POST", body: "{}" });
      toast(`Synced ${r.synced_files || 0} file(s)`);
      route();
    }

    async function addAgent(owner, repo) {
      try {
        await api(`/api/v1/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/agents`, {
          method: "POST",
          body: JSON.stringify({
            name: document.getElementById("agName").value,
            assigned_dimension: document.getElementById("agDim").value,
            agent_type: "ai",
          }),
        });
        route();
      } catch (e) { toast(e.message, true); }
    }
    async function pingAgent(owner, repo, name) {
      await api(`/api/v1/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/agents/heartbeat`, { method: "POST", body: JSON.stringify({ name }) });
      toast("Agent updated");
      route();
    }
    async function sendMsg(owner, repo) {
      try {
        await api(`/api/v1/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/messages`, {
          method: "POST",
          body: JSON.stringify({ recipient: "*", body: document.getElementById("mBody").value }),
        });
        route();
      } catch (e) { toast(e.message, true); }
    }

    async function createTask(owner, repo) {
      try {
        const iss = await api(`/api/v1/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/issues`, {
          method: "POST",
          body: JSON.stringify({
            title: document.getElementById("ntTitle").value,
            assignee: document.getElementById("ntAssign").value,
            body: document.getElementById("ntBody").value,
          }),
        });
        nav(`/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}?tab=issues&issue=${iss.number}`);
      } catch (e) { toast(e.message, true); }
    }
    async function setTaskState(owner, repo, num, state) {
      await api(`/api/v1/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/issues/${num}`, { method: "PATCH", body: JSON.stringify({ state }) });
      route();
    }
    async function postTaskComment(owner, repo, num) {
      const body = document.getElementById("tComment").value.trim();
      if (!body) return;
      await api(`/api/v1/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}/issues/${num}/comments`, { method: "POST", body: JSON.stringify({ body }) });
      route();
    }

    async function saveSettings(owner, repo) {
      const topics = document.getElementById("sTopics").value.split(",").map(s => s.trim()).filter(Boolean);
      await api(`/api/v1/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`, {
        method: "PATCH",
        body: JSON.stringify({
          description: document.getElementById("sDesc").value,
          default_branch: document.getElementById("sDef").value,
          private: document.getElementById("sPriv").checked,
          topics,
        }),
      });
      toast("Settings saved");
      route();
    }
    async function removeRepo(owner, repo) {
      if (!confirm(`Delete project ${owner}/${repo}?`)) return;
      await api(`/api/v1/repos/${encodeURIComponent(owner)}/${encodeURIComponent(repo)}`, { method: "DELETE" });
      nav("/");
    }

    // =========================================================================
    // Secondary Pages: Explore, Global Merges/Tasks, Auth, Create/Import
    // =========================================================================
    async function renderExplore(params) {
      const q = params.get("q") || "";
      const d = await api(`/api/v1/repos?q=${encodeURIComponent(q)}`);
      const repos = d.repos || [];
      document.getElementById("app").innerHTML = `
        <div class="row" style="margin-bottom:14px;">
          <h2 style="margin:0; font-size:18px;">Explore Projects</h2>
          <span class="spacer"></span>
          <input type="text" value="${esc(q)}" placeholder="Filter projects..." style="width:240px;" onkeydown="if(event.key==='Enter') nav('/explore?q='+encodeURIComponent(this.value))" />
        </div>
        <div class="card">
          ${repos.length === 0 ? `<div class="card-body muted">No matching projects.</div>` : repos.map(renderProjectItem).join("")}
        </div>
      `;
    }

    async function renderGlobalPulls(params) {
      const st = params.get("state") || "open";
      const d = await api(`/api/v1/pulls?state=${encodeURIComponent(st)}`);
      const items = d.pulls || [];
      document.getElementById("app").innerHTML = `
        <div class="row" style="margin-bottom:14px;">
          <h2 style="margin:0; font-size:18px;">Merge Requests</h2>
          <span class="spacer"></span>
          <div class="subnav" style="margin:0;">
            <button class="subnav-btn ${st==='open'?'active':''}" onclick="nav('/pulls?state=open')">Open</button>
            <button class="subnav-btn ${st==='merged'?'active':''}" onclick="nav('/pulls?state=merged')">Merged</button>
          </div>
        </div>
        <div class="card">
          ${items.length === 0 ? `<div class="card-body muted">No merge requests.</div>` : items.map(x => `
            <div class="list-row">
              <div>
                <a style="font-weight:600;" href="/${encodeURIComponent(x.owner)}/${encodeURIComponent(x.repo)}?tab=pulls&pr=${x.pull.number}" onclick="nav('/${encodeURIComponent(x.owner)}/${encodeURIComponent(x.repo)}?tab=pulls&pr=${x.pull.number}'); return false;">
                  ${esc(x.owner)}/${esc(x.repo)} #${x.pull.number} — ${esc(x.pull.title)}
                </a>
                <div class="muted small" style="margin-top:3px;"><code>${esc(x.pull.head_ref)}</code> → <code>${esc(x.pull.base_ref)}</code> · ${timeAgo(x.pull.updated_at)}</div>
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }

    async function renderGlobalIssues(params) {
      const st = params.get("state") || "open";
      const d = await api(`/api/v1/issues?state=${encodeURIComponent(st)}`);
      const items = d.issues || [];
      document.getElementById("app").innerHTML = `
        <div class="row" style="margin-bottom:14px;">
          <h2 style="margin:0; font-size:18px;">Tasks</h2>
          <span class="spacer"></span>
          <div class="subnav" style="margin:0;">
            <button class="subnav-btn ${st==='open'?'active':''}" onclick="nav('/issues?state=open')">Open</button>
            <button class="subnav-btn ${st==='closed'?'active':''}" onclick="nav('/issues?state=closed')">Closed</button>
          </div>
        </div>
        <div class="card">
          ${items.length === 0 ? `<div class="card-body muted">No tasks found.</div>` : items.map(x => `
            <div class="list-row">
              <div>
                <a style="font-weight:600;" href="/${encodeURIComponent(x.owner)}/${encodeURIComponent(x.repo)}?tab=issues&issue=${x.issue.number}" onclick="nav('/${encodeURIComponent(x.owner)}/${encodeURIComponent(x.repo)}?tab=issues&issue=${x.issue.number}'); return false;">
                  ${esc(x.owner)}/${esc(x.repo)} #${x.issue.number} — ${esc(x.issue.title)}
                </a>
                <div class="muted small" style="margin-top:3px;">@${esc(x.issue.author)} · ${timeAgo(x.issue.updated_at)}</div>
              </div>
            </div>
          `).join("")}
        </div>
      `;
    }

    function renderLogin() {
      document.getElementById("app").innerHTML = `
        <div class="card" style="max-width:400px; margin:32px auto;">
          <div class="card-head">Sign in</div>
          <div class="card-body">
            <div class="field"><label class="label">Username or Email</label><input id="lUser" type="text" value="pathomphong" /></div>
            <div class="field"><label class="label">Password</label><input id="lPass" type="password" onkeydown="if(event.key==='Enter') doLogin()" /></div>
            <button class="btn btn-primary" style="width:100%;" onclick="doLogin()">Sign in</button>
            <div class="muted small" style="margin-top:12px; text-align:center;">Need an account? <a href="/register" onclick="nav('/register'); return false;">Register</a></div>
          </div>
        </div>
      `;
    }
    async function doLogin() {
      try {
        await api("/api/v1/auth/login", {
          method: "POST",
          body: JSON.stringify({ username: document.getElementById("lUser").value, password: document.getElementById("lPass").value }),
        });
        await loadMe();
        nav("/");
      } catch (e) { toast(e.message, true); }
    }

    function renderRegister() {
      document.getElementById("app").innerHTML = `
        <div class="card" style="max-width:420px; margin:32px auto;">
          <div class="card-head">Create Account</div>
          <div class="card-body">
            <div class="field"><label class="label">Username</label><input id="rUser" type="text" /></div>
            <div class="field"><label class="label">Display Name</label><input id="rName" type="text" /></div>
            <div class="field"><label class="label">Email</label><input id="rEmail" type="email" /></div>
            <div class="field"><label class="label">Password</label><input id="rPass" type="password" /></div>
            <button class="btn btn-primary" style="width:100%;" onclick="doRegister()">Create Account</button>
          </div>
        </div>
      `;
    }
    async function doRegister() {
      try {
        await api("/api/v1/auth/register", {
          method: "POST",
          body: JSON.stringify({
            username: document.getElementById("rUser").value,
            display_name: document.getElementById("rName").value,
            email: document.getElementById("rEmail").value,
            password: document.getElementById("rPass").value,
          }),
        });
        await loadMe();
        nav("/");
      } catch (e) { toast(e.message, true); }
    }

    async function renderUserSettings() {
      await loadMe();
      if (!STATE.me) return renderLogin();
      document.getElementById("app").innerHTML = `
        <div class="grid-2">
          <div class="card">
            <div class="card-head">Personal Access Tokens</div>
            <div class="card-body">
              <div class="row" style="margin-bottom:12px;">
                <input id="tokName" type="text" placeholder="Token label (e.g. macbook-cli)" style="flex:1;" />
                <button class="btn btn-primary" onclick="genToken()">Generate</button>
              </div>
              <div id="newTokArea"></div>
              ${STATE.tokens.map(t => `
                <div class="row" style="padding:8px 0; border-bottom:1px solid var(--border-soft);">
                  <strong>${esc(t.name)}</strong>
                  <code class="muted small">${esc(t.prefix)}...</code>
                  <span class="spacer"></span>
                  <button class="btn btn-sm btn-danger" onclick="delToken('${esc(t.id)}')">Revoke</button>
                </div>
              `).join("") || `<div class="muted small">No tokens created yet.</div>`}
            </div>
          </div>
          <div class="card">
            <div class="card-head">Change Password</div>
            <div class="card-body">
              <div class="field"><label class="label">Current Password</label><input id="pwOld" type="password" /></div>
              <div class="field"><label class="label">New Password</label><input id="pwNew" type="password" /></div>
              <button class="btn btn-primary" onclick="updatePw()">Update Password</button>
            </div>
          </div>
        </div>
      `;
    }
    async function genToken() {
      const r = await api("/api/v1/user/tokens", { method: "POST", body: JSON.stringify({ name: document.getElementById("tokName").value }) });
      await loadMe();
      await renderUserSettings();
      document.getElementById("newTokArea").innerHTML = `
        <div class="status-bar clean" style="margin-bottom:10px;">
          <code style="word-break:break-all;">${esc(r.token)}</code>
          <button class="btn btn-sm" onclick="copyText('${esc(r.token)}')">Copy</button>
        </div>
      `;
    }
    async function delToken(id) {
      await api(`/api/v1/user/tokens/${encodeURIComponent(id)}`, { method: "DELETE" });
      renderUserSettings();
    }
    async function updatePw() {
      try {
        await api("/api/v1/user/password", {
          method: "POST",
          body: JSON.stringify({ current_password: document.getElementById("pwOld").value, new_password: document.getElementById("pwNew").value }),
        });
        toast("Password updated");
      } catch (e) { toast(e.message, true); }
    }

    async function renderAdmin() {
      const d = await api("/api/v1/admin/overview");
      document.getElementById("app").innerHTML = `
        <h2 style="margin:0 0 14px; font-size:18px;">Server Status</h2>
        <div class="grid-3">
          <div class="card"><div class="card-body"><div class="muted small">Projects</div><div style="font-size:24px;font-weight:700;">${d.repo_count}</div></div></div>
          <div class="card"><div class="card-body"><div class="muted small">Stored Objects</div><div style="font-size:24px;font-weight:700;">${d.total_cas_objects}</div></div></div>
          <div class="card"><div class="card-body"><div class="muted small">Disk Usage</div><div style="font-size:24px;font-weight:700;">${fmtBytes(d.disk_bytes)}</div></div></div>
        </div>
      `;
    }

    function ownerSelectOptions() {
      const list = [];
      if (STATE.me) list.push(STATE.me.username);
      else list.push("pathomphong");
      (STATE.orgs || []).forEach(o => { if (!list.includes(o.name)) list.push(o.name); });
      return list.map(o => `<option value="${esc(o)}">${esc(o)}</option>`).join("");
    }

    function renderCreateRepo() {
      document.getElementById("app").innerHTML = `
        <div class="card" style="max-width:560px; margin:20px auto;">
          <div class="card-head">Create New Project</div>
          <div class="card-body">
            <div class="grid-2">
              <div class="field"><label class="label">Owner</label><select id="cOwner">${ownerSelectOptions()}</select></div>
              <div class="field"><label class="label">Project Name</label><input id="cName" type="text" placeholder="my-project" /></div>
            </div>
            <div class="field"><label class="label">Description (optional)</label><input id="cDesc" type="text" /></div>
            <div class="field"><label class="row"><input id="cInit" type="checkbox" checked style="width:auto;" /> Initialize with a README.md</label></div>
            <div class="field"><label class="row"><input id="cPriv" type="checkbox" style="width:auto;" /> Private project</label></div>
            <button class="btn btn-primary" onclick="doCreateRepo()">Create Project</button>
          </div>
        </div>
      `;
    }
    async function doCreateRepo() {
      try {
        const m = await api("/api/v1/repos", {
          method: "POST",
          body: JSON.stringify({
            owner: document.getElementById("cOwner").value,
            name: document.getElementById("cName").value,
            description: document.getElementById("cDesc").value,
            auto_init: document.getElementById("cInit").checked,
            private: document.getElementById("cPriv").checked,
          }),
        });
        nav(`/${encodeURIComponent(m.owner)}/${encodeURIComponent(m.name)}`);
      } catch (e) { toast(e.message, true); }
    }

    function renderMigrateRepo() {
      document.getElementById("app").innerHTML = `
        <div class="card" style="max-width:560px; margin:20px auto;">
          <div class="card-head">Import Git Repository</div>
          <div class="card-body">
            <p class="muted small" style="margin-top:0;">Import any existing Git repository URL into Draft.</p>
            <div class="field"><label class="label">Git Clone URL</label><input id="mUrl" type="text" placeholder="https://github.com/user/repo.git" /></div>
            <div class="grid-2">
              <div class="field"><label class="label">Owner</label><select id="mOwner">${ownerSelectOptions()}</select></div>
              <div class="field"><label class="label">Project Name</label><input id="mName" type="text" /></div>
            </div>
            <button class="btn btn-primary" onclick="doMigrate()">Import Project</button>
          </div>
        </div>
      `;
    }
    async function doMigrate() {
      try {
        toast("Importing Git repository...");
        const m = await api("/api/v1/repos/migrate", {
          method: "POST",
          body: JSON.stringify({
            clone_addr: document.getElementById("mUrl").value,
            owner: document.getElementById("mOwner").value,
            name: document.getElementById("mName").value,
          }),
        });
        nav(`/${encodeURIComponent(m.owner)}/${encodeURIComponent(m.name)}`);
      } catch (e) { toast(e.message, true); }
    }

    function renderCreateOrg() {
      document.getElementById("app").innerHTML = `
        <div class="card" style="max-width:460px; margin:20px auto;">
          <div class="card-head">New Organization</div>
          <div class="card-body">
            <div class="field"><label class="label">Organization Handle</label><input id="oName" type="text" placeholder="my-team" /></div>
            <div class="field"><label class="label">Display Name</label><input id="oDisp" type="text" /></div>
            <button class="btn btn-primary" onclick="doCreateOrg()">Create Organization</button>
          </div>
        </div>
      `;
    }
    async function doCreateOrg() {
      try {
        const o = await api("/api/v1/orgs", {
          method: "POST",
          body: JSON.stringify({ name: document.getElementById("oName").value, display_name: document.getElementById("oDisp").value }),
        });
        await loadMe();
        nav(`/${encodeURIComponent(o.name)}`);
      } catch (e) { toast(e.message, true); }
    }

    async function renderOwner(owner) {
      const d = await api(`/api/v1/repos?owner=${encodeURIComponent(owner)}`);
      const repos = d.repos || [];
      document.getElementById("app").innerHTML = `
        <div class="row" style="margin-bottom:14px;">
          <h2 style="margin:0; font-size:18px;">@${esc(owner)}</h2>
          <span class="badge">${repos.length} project${repos.length !== 1 ? "s" : ""}</span>
        </div>
        <div class="card">
          ${repos.length === 0 ? `<div class="card-body muted">No projects yet.</div>` : repos.map(renderProjectItem).join("")}
        </div>
      `;
    }

    (async function init() {
      await loadMe();
      await route();
    })();
  </script>
</body>
</html>
