services:
  draftmultiverse:
    build:
      context: .
      dockerfile: Dockerfile
    image: draftmultiverse:latest
    container_name: draftmultiverse
    restart: unless-stopped
    ports:
      - "3333:3333"
    volumes:
      - ./:/repo
    environment:
      - DFT_HOST=0.0.0.0
      - DFT_PORT=3333
