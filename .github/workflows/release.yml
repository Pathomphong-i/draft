name: Release & Distribute Binaries

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-13
            target: x86_64-apple-darwin
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-latest
            target: aarch64-unknown-linux-gnu

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross (for Linux ARM64 if needed)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Release Binary
        run: |
          if [ "${{ matrix.target }}" = "aarch64-unknown-linux-gnu" ]; then
            cross build --release --target ${{ matrix.target }} -p daft-cli
          else
            cargo build --release --target ${{ matrix.target }} -p daft-cli
          fi

      - name: Package Binary Archive
        run: |
          BIN_DIR="target/${{ matrix.target }}/release"
          PKG_NAME="dft-${{ matrix.target }}"
          mkdir -p "dist/${PKG_NAME}"
          cp "${BIN_DIR}/dft" "dist/${PKG_NAME}/"
          cp README.md LICENSE "dist/${PKG_NAME}/"
          cd dist
          tar -czf "${PKG_NAME}.tar.gz" "${PKG_NAME}"
          if command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"
          else
            sha256sum "${PKG_NAME}.tar.gz" > "${PKG_NAME}.tar.gz.sha256"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: dist/dft-${{ matrix.target }}.tar.gz*

  publish-release:
    name: Publish GitHub Release
    needs: build-release
    runs-on: ubuntu-latest
    steps:
      - name: Download Built Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-dist
          merge-multiple: true

      - name: Generate Checksums Manifest
        run: |
          cd all-dist
          cat *.sha256 > SHA256SUMS
          ls -la

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            all-dist/*.tar.gz
            all-dist/*.sha256
            all-dist/SHA256SUMS
          generate_release_notes: true
          draft: false
          prerelease: false
